# Settings for tinkerers. Everything here is optional: the app runs without
# this file, and every line that stays commented out keeps the value shown.
# Remove the # in front of a line to change it.
#
# On the Pi the real file is /etc/led-matrix/config.ini
# (setup.sh creates it from this template on the first run).
# After changing it: sudo systemctl restart led-matrix
#
# Language, location, brightness and night mode are set in the web interface
# (http://<hostname>.local/).

[matrix]
# adafruit-hat; adafruit-hat-pwm with the PWM mod (see docs/hardware.md)
# hardware_mapping = adafruit-hat
# 2 for a Pi 3; raise it if the picture flickers
# gpio_slowdown = 2
# Size of the panel in pixels
# rows = 64
# cols = 64

[weather]
# How often the weather is fetched from Open-Meteo, in minutes (at least 5)
# refresh_minutes = 15

[web]
# port = 80

[update]
# Also offer betas (pre-releases) for the update button, for testing a release
# before it goes out (README, Betas)
# betas = no
