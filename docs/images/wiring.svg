<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How the parts connect</title>
  <desc id="desc">The HAT is plugged onto the Raspberry Pi. A ribbon cable runs from the socket on the HAT to the input socket at the top of the panel's back. The panel's power cable runs from the HAT's terminal block to the power connector in the middle of the panel, red to plus and black to minus; the second plug on that cable stays unconnected. A 5 volt, 4 ampere power supply plugs into the barrel jack on the HAT; the HAT passes it on to the panel and the Pi.</desc>

  <defs>
    <path id="ribbon" d="M281,194 H640 C700,194 720,214 720,264"/>
    <path id="arrow" d="M0,-9 V7 M-6,1 L0,8 L6,1" fill="none" stroke="#e8eaed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="pcb">
      <rect x="30" y="40" width="30" height="14" fill="#23262c" stroke="#555c66"/>
      <path d="M33,37.5 H58 M33,56.5 H58" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="2 2.5"/>
      <rect x="64" y="20" width="22" height="10" fill="#23262c" stroke="#555c66"/>
      <circle cx="80" cy="74" r="7" fill="#a7adb5" stroke="#6b727c"/>
    </g>
  </defs>

  <rect x="0.5" y="0.5" width="939" height="639" rx="14" fill="#f6f7f9" stroke="#d0d7de"/>
  <text x="30" y="34" fill="#1f2328" font-size="16" font-weight="700">How the parts connect</text>
  <text x="222" y="34" fill="#57606a" font-size="12">The numbers are the assembly steps. Not to scale.</text>

  <!-- Raspberry Pi, seen from above; the HAT covers most of it -->
  <g transform="translate(150 70)">
    <rect width="289" height="190" rx="10" fill="#1f6b3a" stroke="#2f8a4e" stroke-width="1.5"/>
    <g fill="#c4c9cf" stroke="#7b828c">
      <rect x="238" y="8.5" width="58" height="44.5" rx="2"/>
      <rect x="238" y="69.5" width="58" height="44.5" rx="2"/>
      <rect x="224" y="128.5" width="72" height="54" rx="2"/>
      <rect x="24" y="183" width="24" height="12" rx="2"/>
      <rect x="83.5" y="182" width="51" height="13" rx="2"/>
    </g>
    <path d="M244,30.7 H296 M244,91.7 H296" stroke="#7b828c"/>
    <rect x="173" y="181" width="18" height="15" rx="2" fill="#26292f" stroke="#7b828c"/>
  </g>

  <!-- HAT -->
  <g transform="translate(150 70)">
    <rect width="221" height="190" rx="10" fill="#111316" stroke="#4a515c" stroke-width="1.5"/>
    <g fill="#1f6b3a">
      <circle cx="12" cy="12" r="4.7"/><circle cx="209" cy="12" r="4.7"/>
      <circle cx="12" cy="178" r="4.7"/><circle cx="209" cy="178" r="4.7"/>
    </g>
    <!-- header holes, labelled pad row, breakout pads -->
    <g fill="none" stroke="#c9a15a" stroke-linecap="round">
      <path d="M25.5,14 H190.5 M25.5,22.5 H190.5" stroke-width="5" stroke-dasharray="0 8.636"/>
      <path d="M6.5,37 H216.5" stroke-width="4.2" stroke-dasharray="0 9.11"/>
      <path d="M40.5,51 H49.5" stroke-width="6" stroke-dasharray="0 8.5"/>
      <path d="M65,51 H91.5" stroke-width="6" stroke-dasharray="0 8.67"/>
      <path d="M103.4,51 H130.4 M103.4,59.8 H130.4 M103.4,68.6 H130.4" stroke-width="6" stroke-dasharray="0 8.83"/>
      <path d="M152.3,51 H188.5" stroke-width="6" stroke-dasharray="0 8.93"/>
      <path d="M206.5,50 H215.3" stroke-width="6" stroke-dasharray="0 8.3"/>
    </g>
    <g fill="none" stroke="#111316" stroke-linecap="round" stroke-width="2">
      <path d="M25.5,14 H190.5 M25.5,22.5 H190.5" stroke-dasharray="0 8.636"/>
      <path d="M6.5,37 H216.5" stroke-width="1.6" stroke-dasharray="0 9.11"/>
      <path d="M40.5,51 H49.5" stroke-dasharray="0 8.5"/>
      <path d="M65,51 H91.5" stroke-dasharray="0 8.67"/>
      <path d="M103.4,51 H130.4 M103.4,59.8 H130.4 M103.4,68.6 H130.4" stroke-dasharray="0 8.83"/>
      <path d="M152.3,51 H188.5" stroke-dasharray="0 8.93"/>
      <path d="M206.5,50 H215.3" stroke-dasharray="0 8.3"/>
    </g>
    <!-- chips -->
    <g fill="#23262c" stroke="#555c66">
      <rect x="8" y="52" width="15" height="17"/>
      <rect x="141" y="77" width="24" height="17"/>
      <rect x="184" y="77" width="17" height="17"/>
    </g>
    <path d="M5.5,54 V68 M25.5,54 V68 M143,74.5 H164 M143,96.5 H164 M181.5,79 V93 M203.5,79 V93" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="2 2"/>
    <!-- ribbon cable socket -->
    <rect x="99" y="75" width="30" height="98" rx="2" fill="#1e2126" stroke="#7b828c"/>
    <!-- address E jumper, slot, battery holder -->
    <rect x="135" y="142" width="5" height="13" fill="#c4c9cf"/>
    <rect x="148" y="126" width="4" height="54" rx="2" fill="#0a0b0c"/>
    <circle cx="192" cy="150" r="24" fill="#8d939b" stroke="#c4c9cf"/>
    <circle cx="192" cy="150" r="17" fill="#a7adb5"/>
    <!-- barrel jack -->
    <rect x="-6" y="92" width="46" height="39" rx="3" fill="#26292f" stroke="#7b828c"/>
    <!-- terminal block -->
    <rect x="48" y="170" width="49" height="27" rx="2" fill="#26292f" stroke="#7b828c"/>
    <circle cx="60" cy="184" r="7" fill="#c4c9cf"/><circle cx="85" cy="184" r="7" fill="#c4c9cf"/>
    <path d="M55,184 H65 M80,184 H90" stroke="#555c66" stroke-width="1.5"/>
    <g fill="#e8eaed" font-size="12" font-weight="700" text-anchor="middle">
      <text x="60" y="165">+</text><text x="85" y="165">−</text>
    </g>
  </g>

  <!-- LED panel, seen from the back -->
  <g transform="translate(530 220)">
    <rect width="380" height="380" rx="6" fill="#1d1f23" stroke="#4a515c" stroke-width="1.5"/>
    <g fill="#0b0c0e" stroke="#33383f">
      <rect x="16" y="16" width="108" height="108" rx="10"/><rect x="136" y="16" width="108" height="108" rx="10"/><rect x="256" y="16" width="108" height="108" rx="10"/>
      <rect x="16" y="136" width="108" height="108" rx="10"/><rect x="136" y="136" width="108" height="108" rx="10"/><rect x="256" y="136" width="108" height="108" rx="10"/>
      <rect x="16" y="256" width="108" height="108" rx="10"/><rect x="136" y="256" width="108" height="108" rx="10"/><rect x="256" y="256" width="108" height="108" rx="10"/>
    </g>
    <use href="#pcb" x="16" y="16"/><use href="#pcb" x="256" y="16"/>
    <use href="#pcb" x="16" y="136"/><use href="#pcb" x="256" y="136"/>
    <use href="#pcb" x="16" y="256"/><use href="#pcb" x="256" y="256"/>
    <!-- threaded inserts -->
    <g fill="#c9a15a">
      <circle cx="40" cy="8" r="4.5"/><circle cx="190" cy="8" r="4.5"/><circle cx="340" cy="8" r="4.5"/>
      <circle cx="40" cy="372" r="4.5"/><circle cx="190" cy="372" r="4.5"/><circle cx="340" cy="372" r="4.5"/>
      <circle cx="8" cy="190" r="4.5"/><circle cx="372" cy="190" r="4.5"/>
    </g>
    <g fill="#1d1f23">
      <circle cx="40" cy="8" r="1.8"/><circle cx="190" cy="8" r="1.8"/><circle cx="340" cy="8" r="1.8"/>
      <circle cx="40" cy="372" r="1.8"/><circle cx="190" cy="372" r="1.8"/><circle cx="340" cy="372" r="1.8"/>
      <circle cx="8" cy="190" r="1.8"/><circle cx="372" cy="190" r="1.8"/>
    </g>
    <!-- arrows printed on the board -->
    <use href="#arrow" x="222" y="100"/>
    <use href="#arrow" x="222" y="288"/>
    <use href="#arrow" transform="translate(310 100) rotate(-90)"/>
    <use href="#arrow" transform="translate(70 340) rotate(-90)"/>
    <use href="#arrow" transform="translate(310 340) rotate(-90)"/>
    <!-- input socket (the plug is drawn further down) -->
    <rect x="163" y="44" width="54" height="26" rx="2" fill="#1e2126" stroke="#7b828c"/>
    <!-- power connector -->
    <rect x="172" y="142" width="36" height="16" rx="2" fill="#e8e6df" stroke="#7b828c"/>
    <path d="M178.5,150 H206" stroke="#555c66" stroke-width="5" stroke-dasharray="4 4.5"/>
    <!-- output socket -->
    <rect x="163" y="316" width="54" height="26" rx="2" fill="#1e2126" stroke="#7b828c"/>
    <path d="M169,324 H211.5 M169,334 H211.5" fill="none" stroke="#c9a15a" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0 6"/>
    <g fill="#e8eaed" font-size="11">
      <text x="228" y="62">input</text>
      <text x="190" y="357" text-anchor="middle">output, not used</text>
      <text x="166" y="154" text-anchor="end">GND</text>
      <text x="214" y="154">VCC</text>
    </g>
  </g>
  <text x="720" y="623" fill="#1f2328" font-size="15" font-weight="700" text-anchor="middle">LED panel, seen from the back</text>

  <!-- power supplies and their cables -->
  <g fill="none" stroke="#30363d" stroke-width="5" stroke-linecap="round">
    <path d="M100,181.5 C60,181.5 70,260 75,330"/>
  </g>
  <g fill="#1b1d21" stroke="#8b929c">
    <rect x="100" y="171" width="44" height="21" rx="4"/>
  </g>
  <g fill="#111316" stroke="#5a6370" stroke-width="1.5">
    <rect x="14" y="330" width="124" height="54" rx="8"/>
  </g>
  <g fill="#e8eaed" font-size="13" font-weight="700" text-anchor="middle">
    <text x="76" y="353">5 V / 4 A supply</text>
  </g>
  <g fill="#c9d1d9" font-size="12" text-anchor="middle">
    <text x="76" y="371">barrel plug</text>
  </g>

  <!-- ribbon cable with its two plugs -->
  <g fill="none">
    <use href="#ribbon" stroke="#6e7781" stroke-width="46.5"/>
    <use href="#ribbon" stroke="#b9bec5" stroke-width="44"/>
    <use href="#ribbon" stroke="#a2a8b0" stroke-width="37"/>
    <use href="#ribbon" stroke="#b9bec5" stroke-width="30"/>
    <use href="#ribbon" stroke="#a2a8b0" stroke-width="23"/>
    <use href="#ribbon" stroke="#b9bec5" stroke-width="16"/>
    <use href="#ribbon" stroke="#a2a8b0" stroke-width="9"/>
    <use href="#ribbon" stroke="#b9bec5" stroke-width="2"/>
  </g>
  <g fill="#2a2d33" stroke="#8b929c">
    <rect x="247" y="143" width="34" height="102" rx="3"/>
    <rect x="690" y="258" width="60" height="34" rx="3"/>
  </g>
  <text x="560" y="198.5" fill="#111316" font-size="13" font-weight="700" text-anchor="middle">ribbon cable</text>

  <!-- the panel's power cable -->
  <g fill="none" stroke-linecap="round">
    <path d="M235,262 V420 Q235,440 255,440 H691 Q711,440 711,420 V374" stroke="#9aa0a6" stroke-width="5.5"/>
    <path d="M235,262 V420 Q235,440 255,440 H691 Q711,440 711,420 V374" stroke="#111316" stroke-width="3.5"/>
    <path d="M210,262 V445 Q210,465 230,465 H710 Q730,465 730,445 V374" stroke="#e5484d" stroke-width="4"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M455,440 V522" stroke="#9aa0a6" stroke-width="5.5"/>
    <path d="M455,440 V522" stroke="#111316" stroke-width="3.5"/>
    <path d="M475,465 V522" stroke="#e5484d" stroke-width="4"/>
  </g>
  <rect x="443" y="520" width="44" height="18" rx="2" fill="#e8e6df" stroke="#7b828c"/>
  <path d="M450.5,529 H482" stroke="#555c66" stroke-width="5" stroke-dasharray="4 4.5"/>
  <g fill="#1f2328" font-size="12" text-anchor="middle">
    <text x="465" y="557">second plug,</text>
    <text x="465" y="573">not used</text>
  </g>
  <text x="300" y="425" fill="#1f2328" font-size="12">power cable: red to +, black to −</text>

  <!-- names -->
  <text x="182" y="61" fill="#1f2328" font-size="15" font-weight="700">HAT, plugged onto the Pi</text>
  <text x="408" y="284" fill="#1f2328" font-size="13" font-weight="700" text-anchor="middle">Raspberry Pi</text>

  <!-- assembly steps -->
  <g fill="#f2a33a">
    <circle cx="164" cy="56" r="10"/>
    <circle cx="490" cy="194" r="10"/>
    <circle cx="380" cy="452.5" r="10"/>
    <circle cx="70" cy="255" r="10"/>
  </g>
  <g fill="#111316" font-size="13" font-weight="700" text-anchor="middle">
    <text x="164" y="60.5">3</text>
    <text x="490" y="198.5">4</text>
    <text x="380" y="457">5</text>
    <text x="70" y="259.5">6</text>
  </g>
</svg>
