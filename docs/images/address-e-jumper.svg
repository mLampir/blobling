<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">The address E jumper on the Adafruit RGB Matrix HAT</title>
  <desc id="desc">Left: the HAT seen from above. The jumper sits to the right of the ribbon cable socket, near its lower end. Right: the jumper enlarged. Its three pads are marked 8, E and 16; a blob of solder joins the pads 8 and E, the pad 16 stays free.</desc>

  <rect x="0.5" y="0.5" width="759" height="344" rx="14" fill="#f6f7f9" stroke="#d0d7de"/>
  <text x="40" y="36" fill="#1f2328" font-size="16" font-weight="700">Address E jumper: join the pads 8 and E</text>

  <!-- the HAT from above -->
  <g transform="translate(40 60) scale(1.1765)">
    <rect width="221" height="190" rx="10" fill="#111316" stroke="#4a515c" stroke-width="1.5"/>
    <g fill="#f6f7f9">
      <circle cx="12" cy="12" r="4.7"/><circle cx="209" cy="12" r="4.7"/>
      <circle cx="12" cy="178" r="4.7"/><circle cx="209" cy="178" r="4.7"/>
    </g>
    <!-- header holes, labelled pad row, breakout pads -->
    <g fill="none" stroke="#c9a15a" stroke-linecap="round">
      <path d="M25.5,14 H190.5 M25.5,22.5 H190.5" stroke-width="5" stroke-dasharray="0 8.636"/>
      <path d="M6.5,37 H216.5" stroke-width="4.2" stroke-dasharray="0 9.11"/>
      <path d="M40.5,51 H49.5" stroke-width="6" stroke-dasharray="0 8.5"/>
      <path d="M65,51 H91.5" stroke-width="6" stroke-dasharray="0 8.67"/>
      <path d="M103.4,51 H130.4 M103.4,59.8 H130.4 M103.4,68.6 H130.4" stroke-width="6" stroke-dasharray="0 8.83"/>
      <path d="M152.3,51 H188.5" stroke-width="6" stroke-dasharray="0 8.93"/>
      <path d="M206.5,50 H215.3" stroke-width="6" stroke-dasharray="0 8.3"/>
    </g>
    <g fill="none" stroke="#111316" stroke-linecap="round" stroke-width="2">
      <path d="M25.5,14 H190.5 M25.5,22.5 H190.5" stroke-dasharray="0 8.636"/>
      <path d="M6.5,37 H216.5" stroke-width="1.6" stroke-dasharray="0 9.11"/>
      <path d="M40.5,51 H49.5" stroke-dasharray="0 8.5"/>
      <path d="M65,51 H91.5" stroke-dasharray="0 8.67"/>
      <path d="M103.4,51 H130.4 M103.4,59.8 H130.4 M103.4,68.6 H130.4" stroke-dasharray="0 8.83"/>
      <path d="M152.3,51 H188.5" stroke-dasharray="0 8.93"/>
      <path d="M206.5,50 H215.3" stroke-dasharray="0 8.3"/>
    </g>
    <!-- chips -->
    <g fill="#23262c" stroke="#555c66">
      <rect x="8" y="52" width="15" height="17"/>
      <rect x="141" y="77" width="24" height="17"/>
      <rect x="184" y="77" width="17" height="17"/>
    </g>
    <path d="M5.5,54 V68 M25.5,54 V68 M143,74.5 H164 M143,96.5 H164 M181.5,79 V93 M203.5,79 V93" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="2 2"/>
    <!-- ribbon cable socket with its pins -->
    <rect x="99" y="75" width="30" height="98" rx="2" fill="#1e2126" stroke="#7b828c"/>
    <rect x="103.5" y="80" width="21" height="88" fill="#0a0b0c"/>
    <path d="M109.5,86.5 V162 M118.5,86.5 V162" fill="none" stroke="#c9a15a" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0 10.7"/>
    <text transform="translate(133 80) rotate(90)" fill="#e8eaed" font-size="9">HUB75</text>
    <!-- address E jumper, slot, battery holder -->
    <rect x="135" y="142" width="5" height="13" fill="#c4c9cf"/>
    <rect x="148" y="126" width="4" height="54" rx="2" fill="#f6f7f9"/>
    <circle cx="192" cy="150" r="24" fill="#8d939b" stroke="#c4c9cf"/>
    <circle cx="192" cy="150" r="17" fill="#a7adb5"/>
    <!-- barrel jack -->
    <rect x="-6" y="92" width="46" height="39" rx="3" fill="#26292f" stroke="#7b828c"/>
    <circle cx="-1" cy="111.5" r="6" fill="#0a0b0c" stroke="#7b828c"/>
    <!-- terminal block -->
    <rect x="48" y="170" width="49" height="27" rx="2" fill="#26292f" stroke="#7b828c"/>
    <circle cx="60" cy="184" r="7" fill="#c4c9cf"/><circle cx="85" cy="184" r="7" fill="#c4c9cf"/>
    <path d="M55,184 H65 M80,184 H90" stroke="#555c66" stroke-width="1.5"/>
    <g fill="#e8eaed" font-size="12" font-weight="700" text-anchor="middle">
      <text x="60" y="165">+</text><text x="85" y="165">−</text>
    </g>
  </g>

  <!-- the jumper on the board -->
  <circle cx="201.8" cy="234.7" r="15" fill="none" stroke="#f2a33a" stroke-width="3"/>
  <text x="170" y="322" fill="#1f2328" font-size="13" text-anchor="middle">Next to the ribbon cable socket (HUB75)</text>

  <!-- enlarged -->
  <rect x="380" y="50" width="340" height="270" rx="12" fill="#111316" stroke="#f2a33a" stroke-width="3"/>
  <rect x="420" y="96" width="90" height="190" fill="none" stroke="#e8eaed" stroke-width="2"/>
  <g fill="#c9a15a">
    <rect x="430" y="106" width="70" height="50"/>
    <rect x="430" y="166" width="70" height="50"/>
    <rect x="430" y="226" width="70" height="50"/>
  </g>
  <rect x="426" y="102" width="78" height="118" rx="26" fill="#c4c9cf"/>
  <ellipse cx="452" cy="146" rx="9" ry="28" fill="#ffffff" opacity="0.45"/>

  <g fill="#e8eaed" font-size="20" text-anchor="middle">
    <text x="465" y="88">8</text>
    <text x="528" y="198">E</text>
    <text x="465" y="310">16</text>
  </g>

  <g stroke="#e8eaed" stroke-width="1.5">
    <line x1="504" y1="161" x2="548" y2="161"/>
    <line x1="500" y1="251" x2="548" y2="251"/>
  </g>
  <g fill="#e8eaed" font-size="15">
    <text x="556" y="157">Solder bridge</text>
    <text x="556" y="177">between 8 and E</text>
    <text x="556" y="256">16 stays free</text>
  </g>
</svg>
