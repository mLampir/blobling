# Runs the tests and the type check on every pull request and every push to main (a push to a
# PR's branch is covered by the pull request, so it does not run twice).

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - run: npm run check
