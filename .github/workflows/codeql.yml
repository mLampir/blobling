# Code scanning with CodeQL, on every pull request, every push to main and once a week.
#
# This replaces GitHub's "default setup", which cannot analyse the two native app shells:
# Swift needs a macOS runner and a real Xcode build, and Gradle can only read the Android
# shell (Java) after `npm ci` and `cap sync`, because the Capacitor projects it includes live
# in node_modules. Here both shells are prepared that way, Swift is built on macOS, and the
# rest (Java, TypeScript, Python, the workflows) is read as source.
#
# Default setup must be switched off (Settings -> Code security -> CodeQL analysis ->
# Switch to advanced), otherwise GitHub refuses the results of this workflow.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      contents: read
      security-events: write  # upload the results to the Security tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: none
          - language: swift
            build-mode: manual
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # Both native shells include the Capacitor projects from node_modules, and `cap sync`
      # writes the files they expect (the web app, the config, the Gradle plugin list).
      - if: matrix.language == 'swift' || matrix.language == 'java-kotlin'
        uses: actions/setup-node@v7
        with:
          node-version: 22  # the Capacitor CLI needs 22
          cache: npm

      - if: matrix.language == 'swift' || matrix.language == 'java-kotlin'
        name: Prepare the native shells
        run: |
          npm ci --no-audit --no-fund
          node tools/build.mjs
          npx cap sync ${{ matrix.language == 'swift' && 'ios' || 'android' }}

      # Java is read without a build, but CodeQL asks Gradle for the dependencies.
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Built for the simulator, so no signing is needed.
      - name: Build the iOS shell
        if: matrix.language == 'swift'
        run: |
          xcodebuild build \
            -project app/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results

      # Temporary: lists every result in the log, to go through them once.
      - name: List the results
        if: always()
        run: |
          for f in sarif-results/*.sarif; do
            jq -r '.runs[].results[] | "RESULT \(.ruleId) | \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) | \(.message.text | gsub("\n"; " ") | .[0:200])"' "$f"
          done
