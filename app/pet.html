// Heading for a day in the history: "Today", "Yesterday", then the date, in the language of the page
const LANG = document.documentElement.lang;
function dayLabel(d) {
  const midnight = (x) => new Date(x).setHours(0, 0, 0, 0);
  const days = Math.round((midnight(d) - midnight(Date.now())) / 864e5);
  if (days < -1) return d.toLocaleDateString(LANG, { weekday: "long", day: "numeric", month: "long" });
  const label = new Intl.RelativeTimeFormat(LANG, { numeric: "auto" }).format(days, "day");
  return label[0].toUpperCase() + label.slice(1);
}

// What a line of the history says (without "didn't want to")
function eventText(e) {
  const labels = (current && current.item_labels) || {};
  return e.action === "evolve" && e.accepted ? evolveText(e.item)
    : e.action === "learned" ? t("page.events.learned", { trick: trickLabel(e.item) })
    : e.action === "trick" ? t("page.events.practiced", { trick: trickLabel(e.item) })
    : e.action === "solo" ? (T[`page.events.solo_${e.item}`] ? t(`page.events.solo_${e.item}`)
      : t("page.events.solo_trick", { trick: trickLabel(e.item) }))
    : e.action === "trip" ? T[`areas.${e.item}.trip`] || T[`page.events.trip_${e.item}`] || t("page.events.trip")
    : e.action === "battle" ? battleText(e.item)
    : e.action === "wild" ? wildText(e.item)
    : e.action === "visit" || e.action === "peek" || e.action === "guest"
      ? t(`page.events.${e.action}`, { pet: T[`species.${e.item}`] || e.item })
    : e.action === "swap" ? t("page.events.swap", { pet: e.item || "" })
    : e.action === "bring_back" ? (e.item ? t("page.events.bring_back", { pet: e.item }) : t("page.events.bring_back_alone"))
    : e.action === "copied" ? t("page.events.copied", {
      trick: trickLabel((e.item || "").split(":")[0]), pet: (e.item || "").split(":").slice(1).join(":") })
    : e.action === "gift" ? t("page.events.gift", { pet: T[`species.${e.item}`] || e.item })
    : e.action === "nest" || e.action === "collect" ? t(`page.events.${e.action}`)
    : e.action === "unwrap" ? t("page.events.unwrap", { what: giftLabel(e.item) })
    : e.action === "found" || e.action === "pickup" ? t(`page.events.${e.action}`, { thing: giftLabel(e.item) })
    : e.action === "guardian" ? t("page.events.guardian", { foe: T[`foes.${e.item}`] || e.item })
    : e.action === "unlock" ? t("page.events.unlock", { area: T[`areas.${e.item}.name`] || e.item })
    : e.action === "house" ? t(`page.events.house_${e.item}`)
    : e.action === "train" ? t("page.events.trained", { skill: T[`skills.${e.item}`] || e.item })
    : e.action === "find" ? t("page.events.find", { item: labels[e.item] || e.item })
    : e.action === "fruit" ? t("page.events.picked", { fruit: T[`fruits.${e.item}`] || e.item })
    : e.action === "plant" ? t("page.events.planted", { seed: labels["seed_" + e.item] || t("page.kinds.seed") })
    : e.action === "wear" ? (e.item === "none" ? t("page.events.hat_off") : t("page.events.hat", { item: labels[e.item] || e.item }))
    : e.action === "deco" ? t("page.events.deco", { item: labels[e.item] || e.item })
    : T[`page.events.${e.item}`] || (e.action === "feed" && labels[e.item]) || T[`page.events.${e.action}`] || e.action;
}

// What was in a friend's gift, or what the pet found at home: "fruit_<plant>" or "seed_<plant>"
function giftLabel(gift) {
  const labels = (current && current.item_labels) || {};
  return labels[gift] || gift || "";
}

// Back after a while: what happened while nobody was there, told once (the pet decides when)
let welcomed = stored("welcomed");
function welcome(s) {
  const w = s.welcome;
  if (!w || !w.pages || String(w.since) === welcomed || document.querySelector("dialog[open]")) return;
  welcomed = String(w.since);
  store("welcomed", welcomed);
  $("welcome-text").textContent = t("page.welcome.text", { name: s.name, time: inTime(s.now - w.since) });
  // A few sentences a day in the pet's words; Grandma's postcard after a long time with the Pi off
  $("welcome-story").replaceChildren(...w.pages.map((page) => {
    const p = document.createElement("p");
    p.className = page.postcard ? "postcard" : "story";
    p.textContent = page.text;
    return p;
  }));
  $("welcome").showModal();
}

// What happens on the way of a trip: it is told under the trip's own line, not in the list
const ON_THE_WAY = ["battle", "find", "wild"], TRIP_STOPS = ["snack", "beaten", "tired", "home"];
let travels = [], lastEvents = null;
const openTrips = new Set();  // the trips opened up, by when they set off
function travelOf(e) {
  return e.accepted && e.action === "trip" && travels.find((tr) => tr.area === e.item && Math.abs(tr.start - e.at) < 120);
}
function onTheWay(e) {
  const way = ON_THE_WAY.includes(e.action) || (e.action === "trip" && TRIP_STOPS.includes(e.item));
  return way && travels.some((tr) => e.at >= tr.start && e.at <= tr.end + 5);
}

function renderEvents(events) {
  lastEvents = events;
  let day, last;
  // Single looks in hide and seek stay out of the history (only the start counts),
  // and so do the tap and the answer that belong to an exercise
  events = events.filter((e) => !(e.action === "game" && e.item !== "start")
    && !(e.action === "train" && !(e.item in SKILL_COLORS)) && !onTheWay(e));
  const items = events.flatMap((e) => {
    const li = document.createElement("li");
    if (!e.accepted) li.className = "rejected";
    const d = new Date(e.at * 1000);
    // One heading per day; below it, the times the way the phone is set up to show them
    const heading = d.toDateString() !== day && document.createElement("li");
    if (heading) {
      day = d.toDateString();
      last = null;
      heading.className = "day";
      heading.textContent = dayLabel(d);
    }
    const time = document.createElement("time");
    time.textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const text = document.createElement("span");
    const what = eventText(e);
    // Refused: the pet didn't want to, or (trips, planting) it wasn't possible
    text.textContent = e.accepted ? what
      : t(["trip", "plant"].includes(e.action) ? "page.events.failed" : "page.events.refused", { text: what });
    // The same thing several times in a row is one line with a count (and the time of the latest)
    if (last && last.text === text.textContent) {
      last.times.textContent = `×${++last.n}`;
      return [];
    }
    last = { text: text.textContent, n: 1, times: document.createElement("span") };
    last.times.className = "times";
    li.append(time, text, last.times);
    // a trip opens up with a tap into what happened on the way
    const travel = travelOf(e);
    if (travel) {
      last = null;
      return [...(heading ? [heading] : []), ...tripLines(li, text, travel)];
    }
    // a scuffle that was kept can be watched again
    const replay = e.action === "battle" && current && (current.replays || [])
      .find((r) => r.at === e.at && e.item === `${r.foe}:${r.outcome}`);
    if (replay) li.append(playButton(replay));
    return heading ? [heading, li] : [li];
  });
  if (!items.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = t("page.history_empty");
    items.push(li);
  }
  $("events").replaceChildren(...items);
}

// The line of a trip, with how long it was away, and below it, once opened, what happened on the way
function tripLines(li, text, travel) {
  const note = document.createElement("small");
  note.textContent = t("page.travels.away", { time: inTime(travel.end - travel.start) });
  text.append(note);
  const chev = document.createElement("span");
  chev.className = "chev";
  chev.textContent = "›";
  li.append(chev);
  li.classList.add("trip");
  const open = openTrips.has(travel.start);
  li.classList.toggle("open", open);
  const events = travel.stops.flatMap(stopEvents);
  if (!events.some((e) => e.action !== "trip")) events.push({ at: travel.end, quiet: true });
  events.push({ at: travel.end, action: "trip", item: "home" });
  const lines = events.map((e) => {
    const stop = document.createElement("li");
    stop.className = "stop";
    stop.hidden = !open;
    const time = document.createElement("time");
    time.textContent = new Date(e.at * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const what = document.createElement("span");
    what.textContent = e.quiet ? t("page.travels.quiet") : eventText({ ...e, accepted: true });
    stop.append(time, what);
    // a scuffle that was kept can be watched again
    const replay = e.action === "battle" && current && (current.replays || [])
      .find((r) => r.at === e.at && e.item === `${r.foe}:${r.outcome}`);
    if (replay) stop.append(playButton(replay));
    return stop;
  });
  li.addEventListener("click", () => {
    const opened = !openTrips.delete(travel.start);
    if (opened) openTrips.add(travel.start);
    li.classList.toggle("open", opened);
    lines.forEach((line) => { line.hidden = !opened; });
  });
  return [li, ...lines];
}

function playButton(replay) {
  const play = document.createElement("button");
  play.className = "play";
  play.textContent = "▶";
  play.setAttribute("aria-label", t("page.replay.play"));
  play.addEventListener("click", (e) => {
    e.stopPropagation();
    watch([replay]);
  });
  return play;
}

// A scuffle on a trip: "opponent:outcome" (win, lose, draw, or ball = distracted)
function battleText(item) {
  const [foe, outcome] = (item || "").split(":");
  return t(`page.events.battle_${outcome}`, { foe: T[`foes.${foe}`] || foe });
}

// ---------- Scuffles watched again ----------

// The scuffles on the latest trip
function lastFights(s) {
  return (s.replays || []).filter((r) => r.trip === s.last_trip); // none from a Pi that keeps none yet
}

let watching = [], stopReplay = null;
async function watch(replays) {
  if (stopReplay) stopReplay();
  watching = replays;
  $("replay-again").disabled = true;
  stopReplay = await app.replay($("replay-scene"), replays,
    // who it is up against, and once the rounds are over, how it ended
    (i, over) => {
      const r = replays[i];
      $("replay-text").textContent = over ? battleText(`${r.foe}:${r.outcome}`)
        : t("page.replay.against", { foe: T[`foes.${r.foe}`] || r.foe });
    },
    () => { $("replay-again").disabled = false; });
  if (!$("replay").open) $("replay").showModal();
}
$("replay-again").addEventListener("click", () => watch(watching));
$("replay").addEventListener("close", () => {
  if (stopReplay) stopReplay();
  stopReplay = null;
});
$("watch").addEventListener("click", () => {
  if (!current) return;
  store("watched", String(current.last_trip));
  $("watch").hidden = true;
  watch(lastFights(current));
});

// A wild pet it has shown its tricks to: "species:friend" or "species:shrug"
function wildText(item) {
  const [species, outcome] = (item || "").split(":");
  return t(`page.events.wild_${outcome}`, { pet: T[`species.${species}`] || species });
}

// The trips, for the history: where, when, and what happened on the way
async function loadTravels() {
  try {
    ({ travels } = await api("GET", "/api/pet/travels"));
  } catch (err) {
    travels = []; // an older Pi has no travel diary yet: its trips stay plain lines
  }
  if (lastEvents) renderEvents(lastEvents);
}

// A station of a trip as lines of the history: the scuffle, and what it left behind
function stopEvents(stop) {
  const at = stop.at;
  if (stop.kind === "find") return [{ at, action: "find", item: stop.item }];
  if (stop.kind === "ball") return [{ at, action: "battle", item: `${stop.foe}:ball` }];
  if (stop.kind === "wild") return [{ at, action: "wild", item: `${stop.wild}:${stop.outcome}` }];
  if (stop.kind === "battle") {
    const scuffle = { at, action: "battle", item: `${stop.foe}:${stop.outcome}` };
    return stop.item ? [scuffle, { at, action: "find", item: stop.item }] : [scuffle];
  }
  return [{ at, action: "trip", item: stop.kind }]; // tired, snack, beaten
}

// A slot of the album: a form not met yet gives nothing away (no picture, no name), one only
// seen is an outline with where the pet saw it, one that has been here has its picture and name,
// and a star once it was mastered
function slot(form) {
  const li = document.createElement("li");
  if (!form) {
    li.className = "missing";
    const mark = document.createElement("span");
    mark.textContent = "?";
    li.setAttribute("aria-label", t("page.gallery.missing"));
    li.append(mark);
    return li;
  }
  const img = document.createElement("img");
  img.src = form.seen ? app.outline(form.stage, form.species) : app.icon(form.stage, form.species);
  img.alt = "";
  if (form.seen) {
    li.className = "seen";
    const where = t(`page.gallery.seen.${form.seen.night ? "night" : "day"}`, { where: t(`areas.${form.seen.area}.name`) });
    li.append(img, where);
    return li;
  }
  li.append(img, form.label + (form.mastered ? " ⭐" : ""));
  if (form.mastered) li.setAttribute("aria-label", t("page.gallery.mastered", { form: form.label }));
  return li;
}

async function loadGallery() {
  try {
    // A display with an older version has no album
    const { ancestors, album = [], lines } = await api("GET", "/api/pet/ancestors");
    const met = album.filter(Boolean);
    // The album shows once there is more than the first egg in it (or a friend)
    albumHas = ancestors.length > 0 || met.length > 1;
    if (current) renderFriends(current);
    $("album-count").hidden = !album.length;
    $("album-count").textContent = t("page.gallery.album", { met: met.length, all: album.length });
    $("album").hidden = !album.length;
    // A display with an older version has the album without its pages: all of it on one
    $("album").replaceChildren(...(lines ?? [{ forms: album }]).map((line) => {
      const page = document.createElement("ul");
      page.className = "album";
      // A line nothing is known of yet is an empty page: there is one, and nothing more
      if (!line.forms.some(Boolean)) {
        page.classList.add("unknown");
        page.append(slot(null));
      } else {
        page.append(...line.forms.map(slot));
      }
      return page;
    }));
    $("ancestors-label").hidden = $("gallery").hidden = !ancestors.length;
    $("gallery").replaceChildren(...ancestors.map((a) => {
      const img = document.createElement("img");
      img.src = app.icon(a.stage, a.species);
      img.alt = "";
      const from = new Date(a.born_at * 1000).toLocaleDateString();
      const li = row(a.name, t("page.gallery.entry", {
        form: a.stage === "adult" ? a.species_label : a.stage_label, age: tn("page.days", a.age_days), date: from,
      }) + (a.tricks && a.tricks.length ? ` · ${a.tricks.length} ⭐` : ""));
      li.prepend(img);
      // A pet that rests here can come home again; ancestors from before are only pictures
      if (a.home) {
        const b = document.createElement("button");
        b.className = "small";
        b.textContent = t("page.gallery.bring_back");
        b.addEventListener("click", () => bringBack(a));
        li.append(b);
      }
      return li;
    }));
  } catch (err) {
    // The gallery isn't important enough for an error message
  }
}

// An ancestor comes home: to a house of its own, or in the place of one of the pets at home
async function bringBack(a) {
  if (!current) return;
  const where = await choosePlace(t("page.place_bring_back", { name: a.name }), app.icon(a.stage, a.species));
  if (!where) return;
  try {
    const before = current.pets.map((p) => p.id);
    const r = await api("POST", "/api/pet/bring_back", { born_at: a.born_at, place: where.place });
    if (r.accepted) panTo(before, r.state.id);
    render(r.state);
    feel(r.accepted ? "ok" : "no");
    if (r.accepted) showView("home");
    say(r.accepted ? "" : r.message);
  } catch (err) {
    fail(err);
  }
}

// A tab without content stays hidden; if it was the open one, the history takes over
function offerTab(name, has) {
  document.querySelector(`[data-tab="${name}"]`).hidden = !has;
  showTab(tab);
}

function showTab(name) {
  tab = document.querySelector(`[data-tab="${name}"]`).hidden ? "history" : name;
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.querySelectorAll("[data-panel]").forEach((panel) => { panel.hidden = panel.dataset.panel !== tab; });
}
document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));

// ---------- The tabs at the bottom ----------

function showView(name) {
  view = name;
  for (const v of ["home", "adventure", "diary", "more"]) $(`view-${v}`).hidden = v !== name;
  document.querySelectorAll("[data-view]").forEach((b) => {
    if (b.dataset.view === name) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  if (name === "diary") {
    refresh();
    loadTravels();
    loadGallery();
  }
  if (name === "adventure" && current) {
    packedFor = "";
    renderTrip(current);
  }
  if (name === "more" && app.mode === "local") showLocation();  // the live location may have moved meanwhile
  if (name === "home") nextPreview();
}
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.view !== "home") openSheet(null);
  showView(b.dataset.view);
}));

// ---------- Touching the pet: stroke it ----------

const STROKE_PX = 260;       // this much stroking (px) is one petting …
const PET_EVERY_MS = 2500;   // … sent no more often than this
{
  const hero = $("hero");
  let stroke = null, lastPet = 0;
  hero.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button") || !current || current.trip || baton) return;
    hero.setPointerCapture(e.pointerId);
    stroke = { id: e.pointerId, x: e.clientX, y: e.clientY, way: 0, puffed: 0 };
    updateArea();
  });
  hero.addEventListener("pointermove", (e) => {
    if (!stroke || e.pointerId !== stroke.id) return;
    const step = Math.hypot(e.clientX - stroke.x, e.clientY - stroke.y);
    stroke.x = e.clientX;
    stroke.y = e.clientY;
    if (!onPet(e.clientX, e.clientY)) return;  // only the pet itself can be stroked
    stroke.way += step;
    if (stroke.way - stroke.puffed > 50) {
      stroke.puffed = stroke.way;
      burst(e.clientX, e.clientY);
      feel("stroke");
    }
    if (stroke.way > STROKE_PX && Date.now() - lastPet > PET_EVERY_MS) {
      stroke.way = stroke.puffed = 0;
      lastPet = Date.now();
      const cold = current.cold;
      action("pet").then((r) => {
        render(r.state);
        if (!r.accepted) { say(r.message); feel("no"); }
        else if (cold && !r.state.cold) say(t("page.petting.warmed", { name: r.state.name }));
      }).catch(fail);
    }
  });
  const end = (e) => {
    if (!stroke || e.pointerId !== stroke.id) return;
    // hide and seek: a tap looks behind the spot nearest to it
    if (stroke.way < 8 && current.game && current.game.active && current.game.spots) {
      stroke = null;
      seekAt(e.clientX, e.clientY);
      return;
    }
    // a tap on the egg, a gift or what it found takes it; on the pet with its backpack, unpacks it
    const lying = stroke.way < 8 && lyingAt(e.clientX, e.clientY);
    if (lying || (stroke.way < 8 && current.backpack && !current.trip && onPet(e.clientX, e.clientY))) {
      stroke = null;
      (lying ? TAKE[lying] : unpack)();
      return;
    }
    // a tap on the plant says how it is doing
    if (stroke.way < 8 && onPlant(e.clientX, e.clientY) && !(area && onPet(e.clientX, e.clientY))) {
      stroke = null;
      const plant = current.plant;
      const state = t(plant.ripe ? "page.plant.ripe" : plant.stage === "grown" ? "page.plant.ripening" : "page.plant.growing");
      say(`${PLANT_ICONS[plant.kind] || ""} ${plant.label}: ${state} · ${tn("page.plant.left", plant.left)}`);
      feel("tap");
      return;
    }
    // a tap on the house looks inside for a moment
    if (stroke.way < 8 && onHouse(e.clientX, e.clientY) && !(area && onPet(e.clientX, e.clientY))) {
      stroke = null;
      if (current.actions.look_in) act("look_in");
      return;
    }
    // a tap: one heart
    if (stroke.way < 8 && onPet(e.clientX, e.clientY)) {
      burst(e.clientX, e.clientY);
      feel("tap");
    }
    stroke = null;
  };
  hero.addEventListener("pointerup", end);
  hero.addEventListener("pointercancel", () => { stroke = null; });
}

// ---------- The tray: drag a thing onto the pet ----------
// Dropped right on the pet, food is eaten at once (on the phone, where the page knows where the
// pet is). Anywhere else in the scene, or flicked up, it lands there and the pet goes to get it.
// The sponge is rubbed over the pet. A tap shows the way: the thing hops up towards the pet.
// The same goes for what is eaten or planted from the bag; held a moment, that says what it does.

const RUB_PX = 320;       // this much rubbing (px) is one cleaning
const FLICK_SPEED = 0.5;  // a swipe up this fast (px/ms) throws it into the scene
const sleepMs = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
document.querySelectorAll(".tray .thing").forEach(draggable);
function draggable(b) {
  let drag = null;

  b.addEventListener("pointerdown", (e) => {
    if (b.disabled || drag) return;
    b.setPointerCapture(e.pointerId);
    const ghost = document.createElement("div");
    ghost.className = "ghost";
    ghost.append(b.firstElementChild.cloneNode());
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, trail: [[e.timeStamp, e.clientX, e.clientY]], ghost, rub: 0, rubbed: false, moved: false,
      held: false, timer: 0 };
    if (b.dataset.info) {
      const it = drag;
      it.timer = setTimeout(() => {
        if (it.moved) return;
        it.held = true;
        say(b.dataset.info);
        feel("tap");
      }, HOLD_MS);
    }
    updateArea();
  });
  b.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const last = drag.trail[drag.trail.length - 1];
    drag.trail.push([e.timeStamp, e.clientX, e.clientY]);
    if (!drag.moved && (drag.held || Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8)) return;
    if (!drag.moved) {
      clearTimeout(drag.timer);
      drag.moved = true;
      document.body.append(drag.ghost);
      b.classList.add("lift");
    }
    drag.ghost.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    const inside = overHero(e.clientX, e.clientY);
    $("hero").classList.toggle("drop", inside && !b.dataset.rub);
    if (b.dataset.rub && onPet(e.clientX, e.clientY)) {
      drag.rub += Math.hypot(e.clientX - last[1], e.clientY - last[2]);
      if (Math.random() < 0.3) {
        burst(e.clientX, e.clientY, "bubble");
        feel("bubble");
      }
      if (!drag.rubbed && drag.rub > RUB_PX) {
        drag.rubbed = true;
        const hot = current.hot;
        act("clean").then((r) => {
          if (r?.accepted && hot && !r.state.hot) say(t("page.cooled", { name: r.state.name }));
        });
      }
    }
  });
  const done = () => {
    $("hero").classList.remove("drop");
    b.classList.remove("lift");
  };
  b.addEventListener("pointercancel", () => {
    if (!drag) return;
    clearTimeout(drag.timer);
    drag.ghost.remove();
    drag = null;
    done();
  });
  b.addEventListener("pointerup", async (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const { ghost, trail, moved, rubbed, held, timer } = drag;
    drag = null;
    clearTimeout(timer);
    done();
    if (!moved) {
      ghost.remove();
      if (!held) hop(b);
      return;
    }
    if (b.dataset.rub) {
      ghost.remove();
      if (!rubbed) say(t("page.hint.sponge", { name: current.name }));
      return;
    }
    // Speed from the last 100 ms of the movement
    const from = trail.find(([at]) => e.timeStamp - at <= 100) || trail[trail.length - 1];
    const vy = (e.clientY - from[2]) / Math.max(1, e.timeStamp - from[0]);
    const inside = overHero(e.clientX, e.clientY);
    if (!inside && vy > -FLICK_SPEED) return ghost.remove();
    const direct = inside && area && onPet(e.clientX, e.clientY) && ["feed", "medicine"].includes(b.dataset.action);
    const where = Math.round(Math.max(0, Math.min(1, inScene(e.clientX, e.clientY)[0])) * 100) / 100;
    // it drops into the scene (or into the pet's mouth)
    ghost.style.transition = "transform .3s ease-out, opacity .3s";
    ghost.style.transform += inside ? " scale(.5)" : " translateY(-40vh) scale(.4)";
    ghost.style.opacity = "0";
    setTimeout(() => ghost.remove(), 350);
    try {
      const r = await action(b.dataset.action, b.dataset.item, direct ? {} : { throw: where });
      render(r.state);
      // from the bag: whether that was the favorite, and what food from a trip leaves in the pet
      const name = { name: r.state.name };
      say(!r.accepted ? r.message : b.dataset.item === r.state.favorite_food ? t("page.bag.favorite", name)
        : b.dataset.boost ? t(`page.boost.${r.state.boosts.at(-1)}`, name) : "");
      if (r.accepted) setTimeout(() => feel(direct ? "munch" : "land"), direct ? 0 : LAND_MS);
      else feel("no");
    } catch (err) {
      fail(err);
    }
  });
}

// A tap instead of a drag: the thing hops up towards the pet and falls back
function hop(b) {
  b.classList.remove("hop");
  void b.offsetWidth;  // starts the hop again if it is still going
  b.classList.add("hop");
  b.addEventListener("animationend", () => b.classList.remove("hop"), { once: true });
  feel("tap");
}

$("bag-close").addEventListener("click", () => openSheet(null));

// ---------- The baton: tricks ----------
// While the tricks are open, it is in the hand: a move drawn over the scene is a trick (practiced,
// or shown if the pet knows it), and stroking waits until it is put back.

let baton = false;
function holdBaton(on) {
  baton = on && !!current;
  $("hero").classList.toggle("wand", baton);
}
{
  const hero = $("hero");
  let path = null, held = null;
  hero.addEventListener("pointerdown", (e) => {
    if (!baton || e.target.closest("button")) return;
    hero.setPointerCapture(e.pointerId);
    path = { id: e.pointerId, points: [[e.clientX, e.clientY]], spark: null };
    held = document.createElement("div");
    held.className = "ghost";
    held.append(packPicture("baton"));
    held.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    document.body.append(held);
  });
  hero.addEventListener("pointermove", (e) => {
    if (!path || e.pointerId !== path.id) return;
    path.points.push([e.clientX, e.clientY]);
    held.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    const last = path.spark;
    if (!last || Math.hypot(e.clientX - last[0], e.clientY - last[1]) > 14) {
      burst(e.clientX, e.clientY, "spark");
      path.spark = [e.clientX, e.clientY];
    }
  });
  const end = (e) => {
    if (!path || e.pointerId !== path.id) return;
    const points = path.points;
    path = null;
    held.remove();
    if (e.type === "pointerup") showTrick(points);
  };
  hero.addEventListener("pointerup", end);
  hero.addEventListener("pointercancel", end);
}

// The move drawn with the baton: the trick it stands for, practiced or shown
async function showTrick(path) {
  $("trick-mode").classList.add("drawn");  // the moves have been seen: they stop drawing themselves
  const id = gesture(path);
  // (a little touch is nothing; a real move it doesn't know gets an answer)
  const far = Math.max(...path.map(([x, y]) => Math.hypot(x - path[0][0], y - path[0][1])));
  if (!id) return say(far > 40 ? t("page.trick.unknown", { name: current.name }) : "");
  const known = current.tricks.some((x) => x.id === id && x.learned);
  try {
    const r = await action("trick", id);
    render(r.state);
    const trick = trickLabel(id), result = (r.state.activity_item || "").split(":")[1];
    say(!r.accepted ? r.message
      : result === "learned" ? t("page.trick.learned", { name: r.state.name, trick })
      : known ? t("page.trick.known", { trick })
      : t(result === "fail" ? "page.trick.fail" : "page.trick.ok", { trick }));
    feel(!r.accepted ? "no" : result === "learned" ? "great" : "ok");
  } catch (err) {
    fail(err);
  }
}

// ---------- Sleeping, things at home ----------

$("sleep").addEventListener("click", () => {
  if (current) act(current.asleep ? "wake" : "sleep");
});

// The other pets at home, next to the name: a tap switches to one of them. A dot: it needs
// something; faded: it is away (on a trip, or at Grandma's).
function renderNeighbours(s) {
  const others = s.pets.filter((p) => p.id !== s.id);
  const row = $("neighbours");
  if (row.dataset.ids !== others.map((p) => p.id + p.stage + p.species).join()) {
    row.dataset.ids = others.map((p) => p.id + p.stage + p.species).join();
    row.replaceChildren(...others.map((p) => {
      const b = document.createElement("button");
      b.className = "pill neighbour";
      b.dataset.id = p.id;
      const img = document.createElement("img");
      img.alt = "";
      img.src = app.icon(p.stage, p.species);
      b.append(img);
      b.addEventListener("click", () => look(p.id));
      return b;
    }));
  }
  for (const p of others) {
    const b = row.querySelector(`[data-id="${p.id}"]`);
    b.classList.toggle("needs", p.needs);
    b.classList.toggle("away", p.away || p.grandma);
    b.classList.toggle("phone", !!p.phone);
    b.setAttribute("aria-label", t(p.phone ? "page.look_phone" : "page.look", { name: p.name }));
  }
}

async function look(id) {
  if (!current) return;
  const before = current.pets.map((p) => p.id);
  try {
    const state = await app.look(id);
    panTo(before, state.id);
    render(state);
    feel("tap");
  } catch (err) {
    fail(err);

}

// Which trick was shown? `trail` = the path of the finger as [x, y]
function gesture(trail) {
  const xs = trail.map((p) => p[0]), ys = trail.map((p) => p[1]);
  const left = Math.min(...xs), top = Math.min(...ys);
  const w = Math.max(...xs) - left, h = Math.max(...ys) - top;
  if (trail.length < 3 || Math.max(w, h) < 60) return null;
  // Circle: add up the angles around the center
  let turn = 0, last = null;
  for (const [x, y] of trail) {
    const angle = Math.atan2(y - top - h / 2, x - left - w / 2);
    if (last !== null) turn += ((angle - last + 3 * Math.PI) % (2 * Math.PI)) - Math.PI;
    last = angle;
  }
  // Back and forth: flat, changing direction at least twice
  let flips = 0, dir = 0, anchor = xs[0];
  for (const x of xs) {
    if (Math.abs(x - anchor) < 25) continue;
    const d = Math.sign(x - anchor);
    if (dir && d !== dir) flips++;
    dir = d;
    anchor = x;
  }
  if (flips >= 2 && h < w * 0.5) return "dance";
  // A circle: round (about as tall as wide), going most of the way around
  if (Math.abs(turn) > 5 && Math.min(w, h) > Math.max(w, h) * 0.5) return "spin";
  const dx = xs[xs.length - 1] - xs[0], dy = ys[ys.length - 1] - ys[0];
  if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)) return dy < 0 ? "flip" : "bow";
  return null;
}

// ---------- Training: the battle stats ----------

const THROW_MIN = 60;  // swiping this far up (px) counts as a throw
const THROW_FULL = 4;  // a swipe this fast (screen heights per second) is a throw at full strength
let openTraining;
{
  const mode = $("train-mode"), tell = $("train-say"), ball = $("train-ball"), steps = $("train-steps");
  let stage = "menu", swipe = null, answer = [], length = 0, busy = false, goTimer;

  // What the sheet shows: the list of exercises, or the one that is going on
  const show = (next, hint) => {
    stage = next;
    clearTimeout(goTimer);
    $("train-hint").textContent = hint || t("page.train.hint");
    $("skills").hidden = next !== "menu";
    $("train-back").hidden = next === "menu";
    ball.hidden = next !== "strength";
    $("train-tap").hidden = next !== "speed";
    steps.hidden = next !== "smarts";
    ball.style.transition = "none";
    ball.style.transform = "";
    ball.style.opacity = 1;
  };
  const slots = () => {
    steps.replaceChildren(...Array.from({ length }, (_, i) => {
      const slot = document.createElement("i");
      slot.textContent = ARROWS[answer[i]] || "";
      slot.classList.toggle("on", i < answer.length);
      return slot;
    }));
  };
  // Send a part of an exercise; afterwards say what it brought
  const send = async (item, value, skill) => {
    const before = current && current.skills.find((x) => x.id === skill);
    busy = true;
    try {
      const r = await action("train", item, { value });
      render(r.state);
      if (!r.accepted) {
        tell.textContent = r.message;
        feel("no");
        show("menu");
      }
      busy = false;
      return r.accepted ? { r, before } : null;
    } catch (err) {
      busy = false;
      openSheet(null);
      fail(err);
      return null;
    }
  };
  // `how`: how the exercise went, if there is more to say than the points; `failed`: it brought nothing
  const result = ({ r, before }, skill, how = "", failed = false) => {
    const after = r.state.skills.find((x) => x.id === skill);
    const points = Math.round((after.value - before.value) * 10) / 10;
    const gain = t(points > 0 ? "page.train.gained" : "page.train.nothing", { skill: after.label, points });
    tell.textContent = failed ? how : how ? `${how} · ${gain}` : gain;
    feel(points >= 2 ? "great" : "ok");
    show("menu");
    const row = $("skills").querySelector(`[data-skill="${skill}"]`);
    if (row && points > 0) row.classList.add("hit");
  };

  openTraining = () => {
    tell.textContent = "";
    show("menu");
    openSheet("train-mode");
  };
  $("train-close").addEventListener("click", () => openSheet(null));
  $("train-back").addEventListener("click", () => show("menu"));

  $("skills").addEventListener("click", async (e) => {
    const row = e.target.closest("[data-skill]");
    if (!row || busy) return;
    const skill = row.dataset.skill;
    tell.textContent = "";
    if (skill === "strength") return show("strength", t("page.train.strength"));
    const started = await send(skill);
    if (!started) return;
    if (skill === "speed") return show("speed", t("page.train.speed"));
    // The pet hops the sequence in the scene first; then it is your turn
    const training = started.r.state.training;
    answer = [];
    length = training.length;
    show("smarts", t("page.train.smarts_watch"));
    slots();
    goTimer = setTimeout(() => { $("train-hint").textContent = t("page.train.smarts_go"); }, training.shown_in * 1000);
  });

  $("train-tap").addEventListener("pointerdown", async () => {
    if (busy) return;
    const done = await send("tap", undefined, "speed");
    if (!done) return;
    const early = done.r.state.activity_item === "early";
    result(done, "speed", early ? t("page.train.early") : "", early);
  });

  // Swipes: throw the ball (strength), or swipe the directions back (smarts)
  mode.addEventListener("pointerdown", (e) => {
    if (e.target.closest("button, li") || busy || (stage !== "strength" && stage !== "smarts")) return;
    mode.setPointerCapture(e.pointerId);
    swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, trail: [[e.timeStamp, e.clientY]] };
  });
  mode.addEventListener("pointermove", (e) => {
    if (!swipe || e.pointerId !== swipe.id) return;
    swipe.trail.push([e.timeStamp, e.clientY]);
    if (stage === "strength") ball.style.transform = `translate(${e.clientX - swipe.x}px, ${e.clientY - swipe.y}px)`;
  });
  mode.addEventListener("pointercancel", () => { swipe = null; });
  mode.addEventListener("pointerup", async (e) => {
    if (!swipe || e.pointerId !== swipe.id) return;
    const { x, y, trail } = swipe;
    swipe = null;
    const dx = e.clientX - x, dy = e.clientY - y;
    if (stage === "strength") {
      if (dy > -THROW_MIN) {
        ball.style.transition = "transform .2s";
        ball.style.transform = "";
        return;
      }
      // Strength of the throw: the speed over the last 100 ms of the swipe
      const from = trail.find(([at]) => e.timeStamp - at <= 100) || trail[trail.length - 1];
      const speed = (from[1] - e.clientY) / Math.max(1, e.timeStamp - from[0]) * 1000 / innerHeight;
      const power = Math.round(Math.max(0.05, Math.min(1, speed / THROW_FULL)) * 100) / 100;
      ball.style.transition = "transform .3s ease-out, opacity .3s ease-in";
      ball.style.transform = `translate(${dx}px, ${-innerHeight}px)`;
      ball.style.opacity = 0;
      const done = await send("strength", power, "strength");
      if (done) result(done, "strength", `${Math.round(power * 100)} %`);
    } else if (Math.max(Math.abs(dx), Math.abs(dy)) >= 40) {
      answer.push(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down"));
      slots();
      feel("step");
      if (answer.length < length) return;
      const done = await send("answer", answer, "smarts");
      if (done) {
        const [right, all] = (done.r.state.activity_item || "").split("/");
        result(done, "smarts", t("page.train.smarts_result", { right, steps: all }), right === "0");
      }
    }
  });
}

// ---------- The update of the display ----------
// A Pi installed from a release looks for new ones itself (pi/src/update.ts); here it can be
// started. While it runs, the Pi restarts its app; once its version changes, the update is done.
let update = null, updateChecked = 0;
async function checkUpdate() {
  updateChecked = Date.now();
  let u;
  try {
    u = (await api("GET", "/api/state")).update;
  } catch (_) {
    return;  // during the update the Pi is away for a moment
  }
  if (!u?.current) return;  // set up from a checkout: no updates from here
  if (update && u.current !== update.current) {
    if (!app.native) return location.reload();  // the Pi's own page comes in the new version
    say(t("page.app.update_done", { version: u.current }));
  }
  update = u;
  renderUpdate();
}

function renderUpdate() {
  const u = update;
  renderFit();
  $("display").hidden = false;
  const lines = [t("page.app.update_version", { version: u.current })];
  if (u.running) lines.push(t("page.app.update_running"));
  else if (u.available) lines.push(t("page.app.update_available", { latest: u.latest }));
  else if (u.failed) lines.push(t("page.app.update_failed"));
  $("update-text").textContent = lines.join(" ");
  $("update-text").hidden = false;
  $("update-start").hidden = !u.available && !(app.fit() === "display_old" && !u.running);
  document.querySelector('[data-view="more"]').classList.toggle("news", u.available);
}

// The Pi looks for the newest release once more before it starts, so this never waits for its next look
async function startUpdate(button) {
  button.disabled = true;
  try {
    update = (await api("POST", "/api/update")).update;
    renderUpdate();
  } catch (err) {
    fail(err);
  } finally {
    button.disabled = false;
  }
}
$("update-start").addEventListener("click", () => startUpdate($("update-start")));

// When the Pi and this app no longer understand each other (core/src/api.ts), nothing else works:
// the one that is too old has to be updated. The display can be updated from here.
function renderFit() {
  const fit = app.fit();
  $("mismatch").hidden = fit === "ok";
  if (fit === "ok") return;
  if (!update && Date.now() - updateChecked > 5000) checkUpdate();
  $("mismatch-title").textContent = t(`page.app.${fit}_title`);
  $("mismatch-hint").textContent = t(`page.app.${fit}_hint`);
  const u = fit === "display_old" ? update : null;
  $("mismatch-update-text").textContent = !u ? "" : u.running ? t("page.app.update_running")
    : u.failed ? t("page.app.update_failed") : "";
  $("mismatch-update").hidden = !u || u.running;
  $("mismatch-leave").hidden = !app.connectedTo;
}

});
$("empty-egg").addEventListener("click", async () => {
  await app.hatch();
  $("empty").hidden = true;
  refresh();
});
$("empty-connect").hidden = !app.native;
$("empty-connect").addEventListener("click", () => $("connect").click());

// Back to the pets on the phone; the display keeps its own
$("disconnect").addEventListener("click", () => app.disconnect());
$("offline-leave").addEventListener("click", () => app.disconnect());

// Only poll while the page is visible
function start() {
  stop();
  refresh();
  pollTimer = setInterval(refresh, 5000);
}

function stop() {
  clearInterval(pollTimer);
}

document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
start();
</script>
</body>
</html>
