<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blobling" data-t-content="app.name">
<link rel="icon" href="/pet-icon.png">
<link rel="apple-touch-icon" href="/pet-icon.png">
<title data-t="app.name"></title>
<style>
  /* The pet is the app: its scene fills the top of the screen and is touched directly (stroke it,
     rub it with the sponge, hand it food from the tray). Below it, what it needs and the tray;
     at the bottom the tabs: the pet, the trip, the diary and the rest. One dark night-sky look,
     the scene's own. */
  :root {
    --night: #0d1220; --surface: #161d30; --raised: #1f2840; --line: #2a3452;
    --text: #eef1f8; --muted: #8f9ab3; --accent: #ffb347; --accent-ink: #2a1600; --danger: #ff6b6b;
    --satiety: #ff9f5a; --mood: #ff7aa8; --energy: #ffd34d; --hygiene: #5fd4f0; --health: #6fdc8c;
    --round: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
    --safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
    --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; overflow: hidden; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled, .thing.locked { opacity: .4; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  img { -webkit-user-drag: none; }

  main { height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
  .view { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }

  /* ---------- Home: the scene ---------- */
  .home { display: flex; flex-direction: column; overflow: hidden; }
  .hero {
    position: relative; flex: 1 0 auto; min-height: min(100vw, 480px, calc(100dvh - 330px)); overflow: hidden;
    border-radius: 0 0 30px 30px; touch-action: none; background: var(--sky, #1b2a4a); transition: background 1s;
    container-type: size;
  }
  /* The scene (or the panel's picture) stands on the bottom; the sky goes on above it */
  .scene {
    position: absolute; left: 50%; bottom: 0; width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block;
    transform: translateX(-50%);
    /* on a tall screen it grows into the empty sky, losing a little at the sides */
    width: clamp(100%, calc(100cqh - 100px), 125%);
  }
  .hero::after {
    content: ""; position: absolute; inset: 0 0 auto; height: calc(100px + var(--safe-top)); pointer-events: none;
    background: linear-gradient(rgba(8, 11, 20, .6), transparent);
  }
  .hero.drop .fx { box-shadow: inset 0 0 0 3px var(--accent); border-radius: inherit; }
  .hero-top {
    position: absolute; z-index: 2; inset: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: calc(14px + var(--safe-top)) 16px 0; pointer-events: none;
  }
  .hero-top > * { min-width: 0; }
  h1 { font: 700 26px/1.15 var(--round); margin: 0; text-shadow: 0 2px 8px rgba(0, 0, 0, .5); overflow-wrap: anywhere; }
  .sub { margin: 2px 0 0; font-size: 13px; font-weight: 600; color: #d6dcec; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
  .pill {
    pointer-events: auto; flex: none; height: 40px; padding: 0 14px 0 11px; border-radius: 20px; display: flex; align-items: center; gap: 7px;
    background: rgba(13, 18, 32, .62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); font-weight: 700; font-size: 14px;
  }
  .pill svg { width: 20px; height: 20px; color: var(--energy); }
  /* The name is a button like the sleep button: its picture, the name and an arrow */
  .pill.name { height: auto; min-height: 40px; max-width: 100%; padding: 3px 12px 3px 4px; }
  .pill.name img { flex: none; width: 34px; height: 34px; border-radius: 50%; image-rendering: pixelated; }
  .pill.name h1 { font-size: 20px; text-shadow: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill.name .chev { font-size: 20px; line-height: 1; }
  .hero-buttons { flex: none; display: flex; gap: 8px; }
  .neighbours { display: flex; gap: 6px; }
  .pill.neighbour { position: relative; padding: 0 6px; }
  .pill.neighbour img { width: 28px; height: 28px; image-rendering: pixelated; }
  .pill.neighbour.away img { opacity: .45; }
  .pill.neighbour.phone::before { content: ""; position: absolute; bottom: 3px; left: 3px; width: 6px; height: 9px; border: 1.5px solid var(--muted); border-radius: 2px; }
  .pill.neighbour.needs::after { content: ""; position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .pill.wanted:not(:disabled) { box-shadow: 0 0 0 2px var(--energy); }
  .fx { position: absolute; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .fx span { position: absolute; font-size: 22px; color: var(--mood); animation: float 1s ease-out forwards; }
  .fx span.spark { width: 8px; height: 8px; border-radius: 50%; background: var(--energy); box-shadow: 0 0 8px var(--energy); }
  .fx span.bubble { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--hygiene); background: rgba(95, 212, 240, .15); }
  @keyframes float { from { transform: translate(-50%, -50%) scale(.6); opacity: 1; } to { transform: translate(-50%, -170%) scale(1.15); opacity: 0; } }

  /* What the pet (or the app) has to say: at the top, over everything, gone again by itself */
  .toast {
    position: absolute; z-index: 35; left: 16px; right: 16px; top: calc(10px + var(--safe-top)); margin: 0;
    padding: 12px 16px; border-radius: 16px; background: var(--raised); border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45); font-weight: 600; pointer-events: none;
    opacity: 0; transform: translateY(-12px); transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: none; }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* What it needs: five small meters; a tap says what helps */
  .needs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 12px 14px 2px; }
  .need { display: grid; justify-items: center; gap: 6px; padding: 6px 0; border-radius: 12px; }
  .need svg { width: 22px; height: 22px; color: var(--c); }
  .meter { width: 100%; max-width: 56px; height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
  .meter b { display: block; height: 100%; width: 0; background: var(--c, var(--accent)); border-radius: 3px; transition: width .5s; }
  .need.low .meter { box-shadow: 0 0 0 1px var(--c); }
  .need.low svg { animation: nudge 1.4s infinite; }
  @keyframes nudge { 0%, 70%, 100% { transform: none; } 80% { transform: rotate(-12deg); } 90% { transform: rotate(12deg); } }

  /* Status: when it hatches or evolves, the trip, things waiting at home */
  .status { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 16px 0; text-align: center; }
  .status:empty { display: none; }
  .next { margin: 0; color: var(--muted); font-size: 14px; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .actions:not(:has(button:not([hidden]))) { display: none; }
  .soft { padding: 10px 18px; border-radius: 14px; font-weight: 700; background: var(--surface); border: 1px solid var(--line); }
  .evolve {
    position: relative; overflow: hidden; padding: 12px 24px; border-radius: 14px; font-weight: 700; font-size: 17px;
    background: var(--surface); border: 2px solid var(--accent); touch-action: none;
  }
  .evolve::before { content: ""; position: absolute; inset: 0; width: 0; background: var(--accent); opacity: .45; }
  .evolve.holding::before { width: 100%; transition: width 1.2s linear; }
  .evolve span { position: relative; }

  /* The tray: on top the things to hand the pet, lying there like things: drag one onto it (with a
     Pi, flick it up as well). Below, flat like buttons, the ones a tap opens or starts. */
  .tray { flex: none; display: grid; gap: 4px; padding: 10px 12px 10px; }
  .things, .tools { display: flex; gap: 6px; justify-content: center; }
  .tool {
    flex: 0 1 76px; min-width: 0; height: 52px; border-radius: 14px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .tool img { width: 26px; height: 26px; image-rendering: pixelated; pointer-events: none; }
  .tool small { font-size: 10px; font-weight: 700; max-width: 100%; padding: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool:active { background: var(--surface); }
  .thing {
    flex: 0 1 60px; min-width: 0; height: 66px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; touch-action: none; position: relative;
  }
  .thing img { width: 30px; height: 30px; image-rendering: pixelated; pointer-events: none; }
  .thing small {
    font-size: 10px; font-weight: 700; color: var(--muted); max-width: 100%; padding: 0 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none;
  }
  .thing.lift { opacity: .35; }
  .thing.wanted:not(:disabled) { border-color: var(--accent); }
  .thing.on { border-color: var(--energy); background: var(--raised); box-shadow: 0 0 0 2px var(--energy); }
  /* A tap instead of a drag: the thing hops up towards the pet and falls back */
  .thing.hop img { animation: hop .7s ease-out; }
  @keyframes hop {
    0% { transform: none; } 35% { transform: translateY(-38px) scale(1.15); } 65% { transform: none; }
    80% { transform: translateY(-7px); } 100% { transform: none; }
  }
  .ghost {
    position: fixed; z-index: 50; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px; pointer-events: none;
    display: grid; place-items: center; filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .5));
  }
  .ghost img { width: 46px; height: 46px; image-rendering: pixelated; }

  /* ---------- Tabs ---------- */
  .tabbar {
    flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--night);
    /* room at the bottom: the system's swipe gesture lives there */
    padding: 6px 4px calc(10px + var(--safe-bottom));
  }
  .tabbar button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 700; color: var(--muted); min-width: 0; }
  .tabbar button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
  .tabbar svg { width: 24px; height: 24px; }
  .tabbar button[aria-current="page"] { color: var(--accent); }
  .tabbar button { position: relative; }
  .tabbar button.news::after { content: ""; position: absolute; top: 5px; left: calc(50% + 9px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  /* ---------- The other tabs ---------- */
  .page { padding: calc(18px + var(--safe-top)) 16px 24px; display: grid; gap: 14px; align-content: start; }
  .page h2 { font: 700 24px/1.15 var(--round); margin: 0; }
  .lead { margin: -8px 0 0; color: var(--muted); font-size: 14px; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 4px -6px; }
  .card {
    display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px;
  }
  .card .icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--raised); color: var(--c, var(--accent)); }
  .card .icon svg { width: 26px; height: 26px; }
  .card h3 { margin: 0; font: 700 17px/1.2 var(--round); }
  .card p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .tag { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--raised); color: var(--muted); white-space: nowrap; }
  .tag.go { background: rgba(111, 220, 140, .14); color: var(--health); }
  .segments { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 14px; border: 1px solid var(--line); }
  .segments button { flex: 1 1 0; min-width: 0; padding: 8px 2px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .segments button[aria-pressed="true"], .segments button[aria-selected="true"] { background: var(--raised); color: var(--text); }
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .list > li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); min-width: 0; font-size: 15px; }
  .list > li:first-child { border-top: 0; }
  .list > li > :not(time, .times, button, img, .meter) { flex: 1; min-width: 0; }
  .list small { display: block; color: var(--muted); font-size: 12px; }
  .list .meter { max-width: 90px; flex: none; }
  .list .row { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; }
  .list .row > span:first-child { flex: 1; min-width: 0; }
  .chev { color: var(--muted); }
  time, .times { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
  .times { margin-left: auto; }
  li.day { padding: 14px 16px 4px; color: var(--muted); font-size: 13px; font-weight: 700; background: var(--night); }
  li.rejected { color: var(--muted); }
  .list button.small { min-height: 38px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; flex: none; }
  .list button.small.on { border-color: var(--accent); color: var(--accent); }
  .gallery img { width: 40px; height: 40px; border-radius: 8px; image-rendering: pixelated; }
  /* The album: a page per line with a slot per form; the ones not met yet stay empty, the ones only seen are an outline */
  .pages { display: grid; gap: 10px; }
  .album { list-style: none; margin: 0; padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
  .album li { display: grid; justify-items: center; align-content: start; gap: 4px; padding: 8px 2px; border-radius: 14px; background: var(--raised);
    min-width: 0; font-size: 11px; text-align: center; overflow-wrap: anywhere; }
  .album img { width: 48px; height: 48px; image-rendering: pixelated; }
  .album li.missing { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .album li.missing span { width: 48px; height: 48px; display: grid; place-items: center; font: 700 20px/1 var(--round); }
  .album li.seen { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .album.unknown li { grid-column: 1 / -1; }
  .figure { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; flex: none; max-width: 55%; }
  .empty { padding: 16px; color: var(--muted); font-size: 14px; }
  .note { margin: 0 4px; color: var(--muted); font-size: 13px; }
  .note a, a.note { color: var(--accent); font-weight: 700; }
  .wide { width: 100%; padding: 14px; border-radius: 16px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); }
  .wide.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .wide.danger { border-color: var(--danger); color: var(--danger); }
  .wide.quiet { color: var(--muted); }

  /* ---------- Panels: the bag, tricks, training, hide and seek, the pet's own things ----------
     They take the place of the tray, below the scene and what it needs: the pet stays where it is,
     big and bright, and answers there. */
  .home.busy > .status, .home.busy > .tray { display: none; }
  .home.busy > .hero { min-height: 220px; }  /* the ground and the pet; above is only sky */
  /* The panel's own picture has the clock and the temperature at the top: it is shown whole,
     below the name and the sleep button */
  .home > .hero.whole { flex: 0 1 auto; min-height: 220px; height: calc(min(100vw, 480px) + 80px + var(--safe-top)); }
  .home.busy > .hero.whole { min-height: 60%; }  /* shares a short screen with the panel */
  /* on a short screen it gets smaller rather than pushing the tray away */
  .hero.whole .scene { width: min(100%, calc(100cqh - 80px - var(--safe-top))); border-radius: 0 0 30px 30px; }
  /* It cannot grow into the sky like the pet's own scene, so on a tall screen the room left over
     goes around the meters and the tray instead of above the picture */
  .home:has(> .hero.whole):not(.busy) > .needs { margin-top: auto; }
  .home:has(> .hero.whole):not(.busy) > .tray { margin-block: auto; }
  /* A tall screen has room for bigger things to hand over */
  @media (min-height: 780px) {
    .tray > .things .thing { flex-basis: 64px; height: 76px; border-radius: 20px; gap: 5px; }
    .tray > .things .thing img { width: 38px; height: 38px; }
    .thing small, .tool small { font-size: 11px; }
    .tool { height: 58px; }
    .tool img { width: 30px; height: 30px; }
  }
  .sheet {
    position: relative; flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin-top: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
    background: var(--surface); border-radius: 24px 24px 0 0; border-top: 1px solid var(--line);
    padding: 14px 16px 14px; touch-action: none;
  }
  /* The bag scrolls in its own place, however full it gets: things are dragged out of it onto
     the pet, which stays in sight */
  #bag-mode { touch-action: pan-y; max-height: 42dvh; }
  #pet-mode { max-height: 42dvh; }
  .sheet h3 { margin: 0; font: 700 18px/1.2 var(--round); }
  .sheet p { margin: 0; }
  .sheet small { color: var(--muted); font-size: 13px; }
  .close { position: absolute; right: 6px; top: 4px; width: 44px; height: 44px; font-size: 20px; color: var(--muted); }
  .say { min-height: 1.4em; font-weight: 700; }
  .hearts { margin: 0; color: var(--mood); font-size: 1.2em; letter-spacing: .1em; }
  .tricks { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 360px; text-align: left; }
  .tricks li { display: flex; gap: 12px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); }
  .tricks li > span:first-child { font-size: 24px; width: 32px; text-align: center; }
  .tricks li > div { flex: 1; min-width: 0; }
  .tricks small { display: block; }
  .tricks .meter { display: block; max-width: none; margin-top: 6px; height: 7px; background: var(--line); }
  .tricks li > b { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .tricks li.hit { animation: hit .6s ease-out; }
  /* The four tricks side by side: each move draws itself, one after the other, until the first
     move is drawn over the pet; below it how far the pet has got, a star once it knows it */
  #tricks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 400px; }
  #tricks li { flex-direction: column; gap: 6px; padding: 8px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--raised); text-align: center; }
  #tricks li > div { width: 100%; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  #tricks .move { width: auto; color: var(--energy); }
  #tricks .move svg { width: 40px; height: 40px; }
  #tricks .move path, #tricks .move circle { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 3.2s ease-in-out infinite; }
  #tricks li:nth-child(2) .move :is(path, circle) { animation-delay: .8s; }
  #tricks li:nth-child(3) .move :is(path, circle) { animation-delay: 1.6s; }
  #tricks li:nth-child(4) .move :is(path, circle) { animation-delay: 2.4s; }
  @keyframes draw { 0%, 10% { stroke-dashoffset: 1; } 45%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }
  #trick-mode.drawn .move :is(path, circle) { animation: none; stroke-dashoffset: 0; }
  #tricks .learned svg { width: 16px; height: 16px; color: var(--accent); fill: var(--accent); }
  #skills li > img { width: 32px; height: 32px; image-rendering: pixelated; }
  @keyframes hit { 0% { background: rgba(111, 220, 140, .3); } }
  .ball { width: 72px; height: 72px; image-rendering: pixelated; will-change: transform; }
  .tap { width: min(46vw, 200px); aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--accent); background: var(--raised); font-size: 24px; font-weight: 700; }
  .tap:active { background: var(--accent); color: var(--accent-ink); }
  .steps { display: flex; gap: 8px; min-height: 44px; }
  .steps i { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--line); font-style: normal; font-size: 22px; line-height: 36px; }
  .steps i.on { border-color: var(--accent); color: var(--accent); }
  /* The bag: a shelf each for what it eats, seeds, and what it wears or sets out (and eggs) */
  .shelves { width: 100%; display: grid; gap: 6px; text-align: left; }
  /* Each shelf is one row that scrolls sideways: a swipe to the side looks along it, a drag up
     takes a thing out towards the pet, so the two never get in each other's way */
  .shelf { display: grid; gap: 2px; min-width: 0; }
  .shelf > div {
    display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
    padding: 8px 6px 6px; margin: 0 -6px;
  }
  .shelf > div::-webkit-scrollbar { display: none; }
  .tile { flex: 0 0 66px; height: 66px; touch-action: pan-x; }
  /* how many there are (and once found out: ❤ its favorite, ✕ what it won't eat), what it does,
     and whether it can go into the backpack */
  .tile .n { position: absolute; left: 6px; top: 3px; font-size: 11px; font-weight: 700; color: var(--muted); pointer-events: none; }
  .tile .n b { color: var(--accent); }
  .badge {
    display: inline-flex; align-items: center; gap: 1px; padding: 0 4px; height: 18px; vertical-align: middle;
    border-radius: 9px; background: var(--night); border: 1px solid var(--c); color: var(--c); font-size: 11px; font-weight: 800; pointer-events: none;
  }
  .badge.seed { border-style: dashed; }
  .badge svg { width: 12px; height: 12px; }
  .tile .badge { position: absolute; right: -5px; top: -6px; }
  .tile .packs { position: absolute; right: -5px; bottom: -5px; width: 18px; height: 18px; padding: 1px; border-radius: 6px; background: var(--night); pointer-events: none; }
  .tile.worn { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 179, 71, .35); }
  .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .choices button { padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); }
  .choices button.on { border-color: var(--accent); color: var(--accent); }
  #pack-things img, .steps img { width: 24px; height: 24px; image-rendering: pixelated; vertical-align: middle; }
  /* The trip tab is the packing: where to, what comes along, and the button to send it off */
  .packing { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .packing p { margin: 0; }
  /* the areas of a trip, each with what there is to discover there and its guardian */
  #pack-areas { flex-direction: column; align-items: stretch; }
  #pack-areas .area { display: flex; align-items: center; gap: 10px; text-align: left; }
  #pack-areas .area > span:first-child { min-width: 5.5em; }
  #pack-areas .finds { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #pack-areas img { height: 22px; image-rendering: pixelated; }
  #pack-areas .area > img { height: 30px; }
  #pack-areas .tracks.left { filter: grayscale(1); opacity: 0.45; }
  .steps button { width: 52px; height: 52px; border-radius: 12px; border: 2px dashed var(--line); font-size: 26px; }
  .steps button.on { border-style: solid; border-color: var(--accent); }
  .link { color: var(--muted); text-decoration: underline; padding: 10px; font-size: 14px; }
  .halves { flex: 1; align-self: stretch; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 160px; }
  .halves button { font-size: 52px; color: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--raised); border-radius: 20px; }
  .halves button:active { background: var(--line); }
  .halves small { font-size: 15px; color: var(--muted); }
  #game-info { white-space: pre-line; min-height: 3em; }

  /* Questions (a name, "really?") in the app's own look */
  dialog {
    width: min(340px, calc(100vw - 32px)); margin-top: 18dvh; padding: 20px; border: 1px solid var(--line);
    border-radius: 22px; background: var(--surface); color: var(--text);
  }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog p { margin: 0 0 14px; font-size: 17px; font-weight: 700; }
  dialog input {
    width: 100%; margin-bottom: 14px; padding: 12px; font: inherit; color: var(--text); background: var(--night);
    border: 1px solid var(--line); border-radius: 12px; user-select: text; -webkit-user-select: text;
  }
  dialog input:focus { outline: none; border-color: var(--accent); }
  dialog .buttons { display: flex; gap: 8px; }
  dialog .buttons .wide { flex: 1 1 0; min-width: 0; }
  dialog ul { margin: 0 0 16px; padding: 0; list-style: none; }
  dialog li { display: flex; padding: 6px 0; border-top: 1px solid var(--line); }
  .choice { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 4px 0; }
  .choice img { width: 48px; height: 48px; image-rendering: pixelated; flex: none; }
  .choice small { display: block; color: var(--muted); font-size: 12px; }
  #welcome-story { max-height: 50dvh; overflow-y: auto; margin-bottom: 16px; }
  #welcome-story p { font-size: 16px; font-weight: 400; line-height: 1.45; }
  #welcome-story .postcard {
    white-space: pre-line; padding: 14px 16px; border-radius: 6px; transform: rotate(-1.5deg);
    background: var(--night); border: 2px dashed var(--accent); font-family: var(--round);
  }
  /* A scuffle watched again */
  dialog canvas { display: block; width: 100%; aspect-ratio: 1; margin-bottom: 14px; border-radius: 14px; image-rendering: pixelated; }
  /* A trip in the history opens up into what happened on the way */
  .list > li.trip { cursor: pointer; }
  .list > li.trip .chev { flex: none; transition: transform .2s; }
  .list > li.trip.open .chev { transform: rotate(90deg); }
  .list > li.stop { padding: 8px 16px 8px 28px; font-size: 14px; background: var(--night); border-top-style: dashed; }
  .list .play { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--raised); color: var(--accent); font-size: 13px; }

  /* The Pi can't be reached */
  .offline {
    position: fixed; inset: 0; z-index: 40; background: rgba(13, 18, 32, .94); color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 24px;
  }
  .offline strong { color: var(--text); font-size: 20px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main id="main">

        <li id="new-egg-row"><button class="row" id="new-egg"><span><span data-t="page.new_egg"></span><small data-t="page.more.new_egg_note"></small></span><span class="chev">›</span></button></li>

<script src="app.js"></script>
<script>
// Where the pet lives (on the phone or on the Pi), the texts and the requests: app/src/main.ts
const app = window.blobling;
const $ = (id) => document.getElementById(id);
const T = app.strings;
$("ask-input").maxLength = app.maxName;

// Text for a key from the language file, with {placeholders} filled in
function t(key, values = {}) {
  return (T[key] ?? key).replace(/\{(\w+)\}/g, (all, name) => values[name] ?? all);
}

// Counted text: "<key>.one" for exactly 1, "<key>.other" for everything else
function tn(key, n, values = {}) {
  return t(`${key}.${n === 1 ? "one" : "other"}`, { n, ...values });
}

// Line icons on 24×24 (stroke in the current color)
const ICONS = {
  satiety: '<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1 1-1.5 1-2.5M13 7c0-1 1-1.5 1-2.5"/>',
  mood: '<circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0"/><circle cx="9" cy="10" r=".8" fill="currentColor"/><circle cx="15" cy="10" r=".8" fill="currentColor"/>',
  energy: '<path d="M13 3 5 13.5h6L10 21l9-11h-6z"/>',
  hygiene: '<path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/>',
  health: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  trip: '<path d="M7 8V6a5 5 0 0 1 10 0v2"/><rect x="5" y="8" width="14" height="13" rx="3"/><path d="M9 14h6"/>',
  train: '<path d="M6 9v6M18 9v6M3 11v2M21 11v2M6 12h12"/>',
  trick: '<path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
  game: '<path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4.5"/><circle cx="12" cy="18" r=".8" fill="currentColor"/><circle cx="12" cy="12" r="9.5"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  // the moves for the tricks: a dot where the finger starts
  bow: '<circle cx="12" cy="4" r="1.6" fill="currentColor"/><path d="M12 8v12M6.5 14.5 12 20l5.5-5.5"/>',
  flip: '<circle cx="12" cy="20" r="1.6" fill="currentColor"/><path d="M12 16V4M6.5 9.5 12 4l5.5 5.5"/>',
  dance: '<path d="M4 8.5h15M15.5 5l3.5 3.5-3.5 3.5M20 15.5H5M8.5 12 5 15.5 8.5 19"/>',
  spin: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19 3.5v4h-4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
};
const svg = (name) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
const STATS = ["satiety", "mood", "energy", "hygiene", "health"];
// What seeds and their fruits look like
const PLANT_ICONS = { berry: "🫐", sunflower: "🌻", cherry: "🍒", herb: "🌿" };
// Seeds: a tap switches the kind. The trip: where to and what comes along
const choice = { trip: null };
const packed = [];
// The picture of something in the backpack: the ball, or a thing to eat from the bag
function packPicture(id) {
  const img = document.createElement("img");
  img.alt = "";
  img.src = app.thing(id);
  return img;
}
// Battle stats: the color of the bar (the picture comes from app.thing)
const SKILL_COLORS = { strength: "#ff8a5a", speed: "#ffdc3c", smarts: "#b48cff" };
// What a thing in the bag does, as a small badge on it: [what it shows, its color]. Fruits (and,
// dashed, their seeds) show the need they fill.
const BADGES = {
  satiety: [svg("satiety"), "var(--satiety)"], energy: [svg("energy"), "var(--energy)"],
  mood: [svg("mood"), "var(--mood)"], health: [svg("health"), "var(--health)"],
  heart: [svg("health"), "var(--mood)"], finder: ["✦", "var(--hygiene)"], fresh: [svg("energy"), "var(--energy)"],
  trick: ["×2" + svg("trick"), "var(--energy)"], train: ["×2" + svg("train"), "var(--satiety)"],
  growth: ["↑", "var(--health)"], snow: ["❄", "var(--hygiene)"],
};
const PACKED = ["heart", "finder", "fresh"];  // what works from the backpack on a trip
const ARROWS = { left: "←", right: "→", up: "↑", down: "↓" };
const LAND_MS = 900;  // how long a thrown item falls in the scene (THROW_FALL in core/src/scene.ts)
let pollTimer, sayTimer, current, view = "home", tab = "history";
let gameDismissed = false, gameHold = 0;

function stored(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function store(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

function inTime(seconds) {
  const m = Math.max(1, Math.round(seconds / 60));
  if (m < 90) return t("page.duration.minutes", { n: m });
  const h = Math.round(m / 60);
  if (h < 36) return t("page.duration.hours", { n: h });
  return tn("page.duration.days", Math.round(h / 24));
}

function evolveText(item) {
  const [stage, species] = (item || "").split(":");
  if (stage === "baby") return t("page.events.hatched");
  if (stage === "child") return t("page.events.child", { species: t(`children.${species}`) });
  return t("page.events.adult", { species: t(`species.${species}`) });
}

// What the pet (or the app) has to say – shown at the top, and gone again by itself
function say(msg, isError = false) {
  clearTimeout(sayTimer);
  const toast = $("say");
  toast.classList.toggle("show", !!msg);
  if (!msg) return;  // the old text stays while it fades out
  toast.textContent = msg;
  toast.classList.toggle("error", isError);
  sayTimer = setTimeout(() => toast.classList.remove("show"), 5000);
}

// A question in the app's own dialog. With `value` it asks for a text and resolves to that,
// without it resolves to true; null if the dialog was dismissed.
function ask(text, { value, ok, danger = false, address = false }) {
  const dialog = $("ask"), input = $("ask-input"), wantsText = value !== undefined;
  // an address: as long as it needs to be, small letters, no corrections
  input.maxLength = address ? 253 : app.maxName;
  input.inputMode = address ? "url" : "text";
  input.autocapitalize = address ? "none" : "sentences";
  input.spellcheck = !address;
  input.setAttribute("autocorrect", address ? "off" : "on");
  $("ask-text").textContent = text;
  input.hidden = !wantsText;
  input.value = value || "";
  $("ask-ok").textContent = ok;
  $("ask-ok").className = "wide " + (danger ? "danger" : "primary");
  dialog.returnValue = "";
  dialog.showModal();
  if (wantsText) input.select();
  return new Promise((resolve) => dialog.addEventListener("close", () => {
    resolve(dialog.returnValue !== "ok" ? null : wantsText ? input.value.trim() : true);
  }, { once: true }));
}
$("ask-cancel").addEventListener("click", () => $("ask").close());

// One of a few choices in a dialog: `choices` are [value, picture, name, note]. Returns the value,
// or null if the player changed their mind.
function chooseFrom(text, choices) {
  const dialog = $("place");
  $("place-text").textContent = text;
  $("place-list").replaceChildren(...choices.map(([value, icon, name, note]) => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.className = "choice";
    b.value = value;
    const img = document.createElement("img");
    img.alt = "";
    if (icon) img.src = icon;
    const label = document.createElement("span"), strong = document.createElement("strong"), small = document.createElement("small");
    strong.textContent = name;
    small.textContent = note;
    label.append(strong, small);
    b.append(img, label);
    li.append(b);
    return li;
  }));
  dialog.returnValue = "";
  dialog.showModal();
  return new Promise((resolve) => dialog.addEventListener("close", () => resolve(dialog.returnValue || null), { once: true }));
}

// Where a new pet lives: a house of its own while there is room, or the place of one of the pets
// of `home` (which then moves to the ancestors). Returns { place: null | the pet's id }, or null if
// the player changed their mind.
async function choosePlace(text, icon, home = app.homes()[app.home()]) {
  const free = home.places - home.pets.length;
  const value = await chooseFrom(text, [
    ...(free > 0 ? [["new", icon, t("page.place_new"), t("page.place_free", { free, all: home.places })]] : []),
    ...home.pets.map((p) => [p.id, app.icon(p.stage, p.species), p.name,
      t(p.stage === "egg" ? "page.place_replace_egg" : "page.place_replace")]),
  ]);
  return !value ? null : { place: value === "new" ? null : value };
}
$("place-cancel").addEventListener("click", () => $("place").close());

// What the phone does for a moment: a short buzz (app/src/haptics.ts) and a sound (app/src/sound.ts).
// Each kind names its buzz ("touch", "done", "no", "joy" or "evolve"; "" for none) and its sound.
const FEEL = {
  tap: ["touch", "boop"], stroke: ["touch", "purr"], bubble: ["", "bubble"], step: ["touch", "step"],
  ok: ["done", "ok"], no: ["no", "no"], land: ["done", "plop"], munch: ["done", "munch"],
  sleep: ["done", "sleep"], wake: ["done", "wake"], great: ["joy", "tada"], lost: ["done", "lose"],
  evolve: ["evolve", "evolve"],
};
function feel(kind) {
  const [buzz, sound] = FEEL[kind];
  if (buzz) app.buzz(buzz);
  app.sound(sound);
}

function setOffline(off) {
  $("offline").hidden = !off;
}

// A request to the pet, wherever it lives (app/src/main.ts); an error carries the text to show,
// and `offline` if the Pi could not be reached
async function api(method, url, body) {
  try {
    const data = await app.request(method, url, body);
    setOffline(false);
    $("empty").hidden = true;
    if (app.mode === "pi" && app.home() === "display") renderFit();
    return data;
  } catch (err) {
    if (!err.offline) setOffline(false);
    throw err;
  }
}

function fail(err) {
  if (err.empty) showEmpty(); // the last pet left the phone: a new egg only when asked for
  else if (err.offline) setOffline(true);
  else say(err.message, true);
}

function action(name, item, extra) {
  return api("POST", "/api/pet/action", { id: requestId(), action: name, item, by: "app", ...extra });
}

function requestId() {
  // crypto.randomUUID only exists over HTTPS
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

// Action without a throw: show the answer, vibrate briefly
async function act(name, item, extra) {
  try {
    const r = await action(name, item, extra);
    render(r.state);
    say(r.accepted ? "" : r.message);
    feel(!r.accepted ? "no" : name === "sleep" || name === "wake" ? name : "ok");
    return r;
  } catch (err) {
    fail(err);
    if (current) render(current);
  }
}

// ---------- The scene ----------

// The scene goes on this canvas: drawn on the phone, or with a Pi the panel's frames, one after the other
const scene = $("scene");
scene.hidden = false;
app.showScene(scene);

// The sky goes on above the scene in the color of its top row
const sample = document.createElement("canvas");
sample.width = sample.height = 1;
function matchSky() {
  try {
    const c = sample.getContext("2d", { willReadFrequently: true });
    // just below the status line (the clock and the temperature on the panel's picture)
    c.drawImage(scene, 1, 8, 1, 1, 0, 0, 1, 1);
    const [r, g, b] = c.getImageData(0, 0, 1, 1).data;
    $("hero").style.setProperty("--sky", `rgb(${r}, ${g}, ${b})`);
  } catch {
    // a picture from another address can't be read: the sky keeps its color
  }
}
setInterval(() => { if (!document.hidden && view === "home") matchSky(); }, 2000);

// Switching to another pet with a Pi: the camera pans along the street from the house it showed
// (on the phone, its own scene does that by itself). `before`: the ids of the pets, in the order
// of their houses, before the switch.
let panning = null, panFrame = null, previewGen = 0;
function panTo(before, id) {
  if (app.home() === "phone" || !current || id === current.id) return;
  const from = before.indexOf(current.id), to = before.indexOf(id);
  const steps = from >= 0 && to >= 0 ? to - from : 1;
  const copy = document.createElement("canvas");
  copy.width = scene.width;
  copy.height = scene.height;
  copy.getContext("2d").drawImage(scene, 0, 0);
  panning = { from: copy, steps, start: performance.now(), seconds: app.panSeconds(steps) };
  panFrame = null;
  previewGen++;
  requestAnimationFrame(drawPan);
}
function drawPan(now) {
  if (!panning) return;
  const c = scene.getContext("2d"), w = scene.width;
  const progress = (now - panning.start) / 1000 / panning.seconds;
  if (progress >= 1) {
    panning = null;
    if (panFrame) c.drawImage(panFrame, 0, 0, w, scene.height);
    return;
  }
  const shift = Math.round(app.eased(progress) * w), dir = panning.steps < 0 ? -1 : 1;
  c.fillStyle = "#000";
  c.fillRect(0, 0, w, scene.height);
  c.drawImage(panning.from, -dir * shift, 0);
  if (panFrame) c.drawImage(panFrame, dir * (w - shift), 0, w, scene.height);
  requestAnimationFrame(drawPan);
}

// With a Pi: each frame the panel draws, while the pet is in sight. The Pi answers as soon as it
// has drawn the next one, so the next request goes out right away; after a failure, a little later.
const PREVIEW_RETRY_MS = 1000;
let previewBusy = false, previewFailed = 0;
function nextPreview() {
  if (app.home() === "phone" || previewBusy || document.hidden || view !== "home") return;
  if (Date.now() - previewFailed < PREVIEW_RETRY_MS) return;
  previewBusy = true;
  const img = new Image(), gen = previewGen;
  img.onload = () => {
    // a frame of the pet looked at before the switch doesn't count any more
    if (gen === previewGen && panning) panFrame = img;
    else if (gen === previewGen) scene.getContext("2d").drawImage(img, 0, 0, scene.width, scene.height);
    if (!matchSky.done) { matchSky.done = true; matchSky(); }
    previewBusy = false;
    nextPreview();
  };
  img.onerror = () => { previewBusy = false; previewFailed = Date.now(); };
  img.src = app.previewUrl();
}
// picks it up again when the page comes back to the pet
if (app.mode !== "local") setInterval(nextPreview, 250);

// Where the pet is in the picture (on the phone); with a Pi the whole picture counts
let area = null;
async function updateArea() { area = await app.petArea(); }
setInterval(() => { if (!document.hidden && view === "home") updateArea(); }, 250);

// A point on the screen as parts (0–1) of the scene, and whether the pet is there
function inScene(x, y) {
  const r = scene.getBoundingClientRect();
  return [(x - r.left) / r.width, (y - r.top) / r.height];
}
function onPet(x, y) {
  const [u, v] = inScene(x, y);
  if (!area) return u >= 0 && u <= 1 && v >= 0 && v <= 1;
  const [ax, ay, aw, ah] = area, m = 0.03;  // a little room around it
  return u >= ax - m && u <= ax + aw + m && v >= ay - m && v <= ay + ah + m;
}
// Whether a point is on the plant
function onPlant(x, y) {
  if (!current || !current.plant || !current.plant.area || current.trip) return false;
  const [u, v] = inScene(x, y), [ax, ay, aw, ah] = current.plant.area;
  return u >= ax && u <= ax + aw && v >= ay && v <= ay + ah;
}
// Whether a point is on the house (it stands at the same place on the phone and on the Pi)
function onHouse(x, y) {
  if (!current || !current.house || current.trip) return false;
  const [u, v] = inScene(x, y), [ax, ay, aw, ah] = current.house.area;
  return u >= ax && u <= ax + aw && v >= ay && v <= ay + ah;
}
// What is lying in the scene at a point: "nest", "gift", "found" or null
function lyingAt(x, y) {
  if (!current || !current.lying || current.trip) return null;
  const [u, v] = inScene(x, y), m = 0.02;
  const hit = Object.entries(current.lying).find(([, [ax, ay, aw, ah]]) =>
    u >= ax - m && u <= ax + aw + m && v >= ay - m && v <= ay + ah + m);
  return hit ? hit[0] : null;
}
function overHero(x, y) {
  const r = $("hero").getBoundingClientRect();
  return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
}

function burst(x, y, kind = "heart") {
  const r = $("hero").getBoundingClientRect();
  const s = document.createElement("span");
  if (kind === "heart") s.textContent = "♥"; else s.className = kind;
  s.style.left = x - r.left + "px";
  s.style.top = y - r.top + "px";
  s.addEventListener("animationend", () => s.remove());
  $("fx").append(s);
}

// ---------- Display ----------

$("stats").innerHTML = STATS.map((key) =>
  `<button class="need" data-key="${key}" style="--c:var(--${key})">${svg(key)}<span class="meter"><b></b></span></button>`).join("");
document.querySelectorAll(".tray .thing, .tool").forEach((b) => { b.firstElementChild.src = app.thing(b.dataset.thing); });
$("train-ball").src = app.thing("strength");

function render(s) {
  current = s;
  $("hero").classList.toggle("whole", app.home() !== "phone");
  renderMoving(s);
  $("name").textContent = s.name;
  $("name-icon").src = app.icon(s.stage, s.species);
  $("nav-name").textContent = s.name;
  renderNeighbours(s);
  document.querySelectorAll(".pet-name").forEach((e) => { e.textContent = s.name; });
  document.title = s.name;
  const egg = s.stage === "egg";
  const evo = s.evolution;
  const doing = s.trip ? s.trip.where : s.asleep ? t("page.status.asleep")
    : s.cold ? t("page.status.cold") : s.hot ? t("page.status.hot") : t(`page.moods.${s.mood}`);
  const form = s.stage === "adult" ? s.species_label : s.stage_label;
  $("sub").textContent = egg ? t("page.status.egg")
    : t("page.status.line", { form, age: tn("page.age", s.age_days), doing });

  // What it needs
  $("stats").hidden = egg;
  document.querySelectorAll(".need").forEach((b) => {
    const key = b.dataset.key, value = s.stats[key];
    b.classList.toggle("low", s.needs.includes(key));
    b.querySelector("b").style.width = value + "%";
    b.setAttribute("aria-label", `${t(`page.stats.${key}`)} ${value}`);
  });

  welcome(s);

  // Next evolution: only the egg tells when; a baby or child just says when it is ready
  const due = !!(evo && evo.due);
  $("next").hidden = !evo || (!due && !egg);
  if (evo && !$("next").hidden) {
    $("next").textContent = !due ? t(`page.next.${evo.next}`, { time: inTime(evo.due_at - s.now) })
      : s.asleep ? t("page.next.ready_asleep")
        : t("page.next.ready", { time: inTime(evo.auto_at - s.now) });
  }
  $("evolve").hidden = !due;
  $("evolve").disabled = !s.actions.evolve;
  $("evolve-label").textContent = t(egg ? "page.hatch" : "page.evolve");

  // Trip: when it will be back and what it has found so far
  $("trip-info").hidden = $("recall").hidden = !s.trip;
  if (s.trip) {
    const found = s.trip.found.map((id) => s.item_labels[id] || id).join(", ");
    // hearts: a lost scuffle costs one; next to them, what is still in the backpack from home
    $("trip-info").textContent = t(s.trip.returning ? "page.trip.returning" : "page.trip.out", { time: inTime(s.trip.end - s.now) })
      + ` · ${"♥".repeat(s.trip.hearts)}`
      + (s.trip.pack.length ? ` · ${s.trip.pack.map((id) => s.item_labels[id] || t("pack.ball")).join(", ")}` : "")
      + (found ? ` · ${t("page.trip.backpack", { items: found })}` : "");
    $("recall").disabled = s.trip.end - s.now <= 300;
  } else if (s.backpack) {
    // back home: it only shows its finds when someone is watching
    $("trip-info").hidden = false;
    $("trip-info").textContent = s.asleep ? t("page.trip.full_asleep") : t("page.trip.back", { name: s.name });
  }
  // at Grandma's (nobody was there for a long time): it waits there to be fetched
  if (s.grandma) {
    $("trip-info").hidden = false;
    $("trip-info").textContent = t("page.grandma.info", { name: s.name });
  }
  $("grandma").hidden = !s.grandma;
  // the scuffles of the last trip, until they have been watched or the next trip sets off
  const fights = s.trip ? [] : lastFights(s);
  $("watch").hidden = !fights.length || stored("watched") === String(s.last_trip);
  $("watch").textContent = tn("page.replay.watch", fights.length);

  // The tray: an egg can only be kept warm (by stroking it)
  $("tray").hidden = egg;
  document.querySelectorAll(".tray .thing").forEach((b) => {
    const a = b.dataset.action;
    b.hidden = a === "medicine" && !s.sick;
    b.disabled = !s.actions[a];
    b.classList.toggle("wanted", s.needs.includes(b.dataset.helps));
  });
  // Tricks, training and hide and seek wait while it is away; when it can't right now, it says so
  // once asked (the bag opens always)
  const away = !!s.trip || !!s.grandma;
  document.querySelectorAll(".tool").forEach((b) => { b.disabled = b.dataset.tool !== "bag" && away; });
  if (away && baton) holdBaton(false);
  renderBag(s);

  // Sleeping: what the button does is what it says
  const sleep = $("sleep");
  sleep.hidden = egg || !!s.trip || !!s.grandma;
  sleep.innerHTML = s.asleep ? svg("sun") + `<span>${t("page.wake")}</span>` : svg("moon") + `<span>${t("page.sleep")}</span>`;
  sleep.disabled = !(s.asleep ? s.actions.wake : s.actions.sleep);
  sleep.classList.toggle("wanted", !s.asleep && s.needs.includes("energy"));

  renderGame(s);
  renderTricks(s);
  renderSkills(s);
  renderValues(s);
  renderStatistics(s);
  renderFriends(s);
  renderTrip(s);
  $("new-egg-row").hidden = egg;
  // the display keeps its last pet
  $("retire-row").hidden = app.home() === "display" && s.pets.filter((p) => !p.phone).length <= 1;
}

// The meters: a tap says how it is and what would help
$("stats").addEventListener("click", (e) => {
  const b = e.target.closest(".need");
  if (!b || !current) return;
  const key = b.dataset.key;
  say(`${t(`page.stats.${key}`)} ${current.stats[key]} · ${t(`page.needs.${key}`, { name: current.name })}`);
});

// Where a trip can go: [key, name]
function options(s, action) {
  return s.areas.filter((a) => a.unlocked).map((a) => [a.id, a.label]);
}

function picked(s, action) {
  const all = options(s, action);
  return all.find((x) => x[0] === choice[action]) || all[0];
}

// Sheets: one at a time, in the place of the tray, with the scene and what it needs in sight
function openSheet(id) {
  if (id !== "trick-mode" && !$("trick-mode").hidden) holdBaton(false); // the tricks hand the baton back
  document.querySelectorAll(".sheet").forEach((sheet) => { sheet.hidden = sheet.id !== id; });
  $("view-home").classList.toggle("busy", !!id);
  if (id) showView("home");
}

// The lower row of the tray: a tap opens the bag, the tricks or the training, or starts hide and seek
const TOOLS = {
  bag: () => openSheet("bag-mode"),
  baton: () => openTricks(),
  train: () => openTraining(),
  game: () => act("game", "start"),
};
document.querySelectorAll(".tool").forEach((b) => b.addEventListener("click", () => { if (current) TOOLS[b.dataset.tool](); }));
$("name-button").addEventListener("click", () => { if (current) openSheet("pet-mode"); });
$("pet-close").addEventListener("click", () => openSheet(null));

// ---------- The trip ----------
// The tab is the packing itself. While the pet can't set off for a while (it is still an egg or
// too little, it is away, its backpack is still full), that stands there instead.

let packedFor = "";
function renderTrip(s) {
  const reason = s.stage === "egg" ? t("page.adventure.egg")
    : s.stage === "baby" ? t("pet.rejected.too_young", { name: s.name })
    : s.trip || s.grandma || s.backpack ? $("trip-info").textContent : "";
  $("adventure-lead").hidden = !reason;
  $("adventure-lead").textContent = reason;
  $("packing").hidden = !!reason;
  // built again only when something changes, so a tap in the middle of it isn't lost
  const key = JSON.stringify([s.id, s.areas, s.packable, s.trip_hearts, s.max_pack]);
  if (!reason && view === "adventure" && key !== packedFor) {
    packedFor = key;
    renderPack();
  }
}

// The hearts it would set off with now, out of the usual three
function tripHearts(s, more = 0) {
  const n = s.trip_hearts + more;
  return "♥".repeat(n) + "♡".repeat(Math.max(0, 3 - n));
}

// Packing: the destination, and up to max_pack things that help on the way
function renderPack() {
  const s = current, area = picked(s, "trip");
  for (let i = packed.length - 1; i >= 0; i--) {
    const thing = s.packable.find((x) => x.id === packed[i]);
    if (!thing || packed.filter((id) => id === packed[i]).length > thing.count) packed.splice(i, 1);
  }
  // An area opens up once the pet has got past the guardian of the one before
  const going = area && s.areas.find((a) => a.id === area[0]);
  $("pack-say").textContent = going && going.guardian ? t("page.pack.guardian") : "";
  $("pack-areas").replaceChildren(...s.areas.map((a) => {
    const b = document.createElement("button");
    b.className = "area";
    const name = document.createElement("span");
    name.textContent = a.unlocked ? a.label : `🔒 ${a.label}`;
    b.append(name);
    // What there is to discover there once, and its guardian: colored once found or beaten, else
    // an outline. Behind a guardian the pet hasn't got past yet, nothing shows.
    if (a.unlocked) {
      const picture = (id, found, label) => {
        const img = document.createElement("img");
        img.src = app.discovery(id, found);
        img.alt = found ? label : "?";
        return img;
      };
      const finds = document.createElement("span");
      finds.className = "finds";
      finds.append(...a.finds.map((f) => picture(f.id, f.found, s.item_labels[f.id] || f.id)));
      b.append(finds);
      // tracks: a wild pet of a line never had still lives there (gray), or none does any more
      if (a.wild_left !== null) {
        const tracks = document.createElement("span");
        tracks.className = "tracks";
        tracks.textContent = "🐾";
        tracks.classList.toggle("left", a.wild_left);
        b.append(tracks);
      }
      b.append(picture(`foe_${a.keeper}`, !a.guardian, T[`foes.${a.keeper}`] || a.keeper));
    }
    b.classList.toggle("on", !!area && a.id === area[0]);
    b.addEventListener("click", () => {
      if (!a.unlocked) return void ($("pack-say").textContent = t("page.pack.locked", { area: a.blocked_by }));
      choice.trip = a.id;
      renderPack();
    });
    return b;
  }));
  // Slots: a tap takes the thing out again
  $("pack-slots").replaceChildren(...Array.from({ length: s.max_pack }, (_, i) => {
    const b = document.createElement("button");
    b.replaceChildren(...(packed[i] ? [packPicture(packed[i])] : []));
    b.classList.toggle("on", i < packed.length);
    b.disabled = i >= packed.length;
    b.addEventListener("click", () => {
      packed.splice(i, 1);
      renderPack();
    });
    return b;
  }));
  $("pack-things").replaceChildren(...s.packable.map((thing) => {
    const b = document.createElement("button");
    b.replaceChildren(packPicture(thing.id), ` ${thing.label}`);
    if (thing.id === s.disliked_food) b.append(" ✕"); // it won't eat that on the way either
    // what works from the backpack carries its badge, as in the bag
    const effects = packedEffects(thing.id);
    if (effects.length) b.append(" ", ...badge(effects));
    b.disabled = packed.length >= s.max_pack || packed.filter((id) => id === thing.id).length >= thing.count;
    b.addEventListener("click", () => {
      packed.push(thing.id);
      renderPack();
      // once packed, it says what it does on the way
      $("pack-say").textContent = `${thing.label}: ${packText(thing.id)}`;
    });
    return b;
  }));
  // the hearts it would set off with: feeding it first can make one more
  // a honeycomb packed is one heart more right away
  $("pack-hearts").textContent = tripHearts(s, packed.includes("honeycomb") ? 1 : 0);
}
// What a thing in the backpack does on the way: the ball plays with wild pets, anything to eat heals
// a heart after a lost scuffle, and some food works from the backpack besides
function packedEffects(id) {
  const item = current && current.items.find((x) => x.id === id);
  return item ? item.effects.filter((k) => PACKED.includes(k)) : [];
}
function packText(id) {
  if (id === "ball") return t("page.pack.ball_does");
  return [...effectText(packedEffects(id)), t("page.pack.food_does")].join(" · ");
}

// If it can't set off right now (asleep, too tired, …), it says why once asked
$("pack-go").addEventListener("click", async () => {
  const area = current && picked(current, "trip");
  if (!area) return;
  try {
    // the backpack drops into the scene, the pet puts it on and sets off
    const r = await action("trip", area[0], { throw: 0.5, value: [...packed] });
    render(r.state);
    if (!r.accepted) {
      $("pack-say").textContent = r.message;
      return feel("no");
    }
    feel("ok");
    packed.length = 0;
    showView("home");
  } catch (err) {
    fail(err);
  }
});

// A new egg: one of those that are kept (an entry of "eggs" in the state), or a usual one. It gets a
// house of its own, or the place of one of the pets at home.
async function newEgg(egg) {
  if (!current) return;
  const where = await choosePlace(egg ? t("page.place_brood", { egg: egg.label }) : t("page.place_new_egg"),
    app.icon("egg", egg ? egg.line : "blob"));
  if (!where) return;
  try {
    const request = { confirm: true, place: where.place };
    if (egg) request.egg = egg.id;
    const before = current.pets.map((p) => p.id);
    const state = await api("POST", "/api/pet/new_egg", request);
    panTo(before, state.id);
    render(state);
    showView("home");
    say(t("page.new_egg_done"));
  } catch (err) {
    fail(err);
  }
}

// ---------- Diary ----------

// One line of a list: a label with an optional note below it, and whatever goes on the right
function row(label, note, ...right) {
  const li = document.createElement("li");
  const text = document.createElement("span");
  text.append(label);
  if (note) {
    const small = document.createElement("small");
    small.textContent = note;
    text.append(small);
  }
  li.append(text, ...right);
  return li;
}

function figure(value) {
  const span = document.createElement("span");
  span.className = "figure";
  span.textContent = value;
  return span;
}

// A meter, `percent` of it filled
function meter(percent, color) {
  const bar = document.createElement("span");
  bar.className = "meter";
  if (color) bar.style.setProperty("--c", color);
  bar.append(document.createElement("b"));
  bar.firstChild.style.width = percent + "%";
  return bar;
}

// ---------- The bag ----------
// A shelf each for what it eats, the seeds, and what it wears or sets out (with the eggs to brood).
// What it eats and the seeds are dragged onto the pet like the things in the tray; a hat or a
// decoration is put on or away with a tap, an egg is brooded. Held a moment, each says what it does.

// One thing in the bag: its picture, its name, and what it says when held
function bagTile(picture, label, info) {
  const b = document.createElement("button");
  b.className = "thing tile";
  const img = document.createElement("img");
  img.alt = "";
  img.src = picture;
  const small = document.createElement("small");
  small.textContent = label;
  b.append(img, small);
  b.dataset.info = info;
  b.setAttribute("aria-label", info);
  b.addEventListener("contextmenu", (e) => e.preventDefault());
  return b;
}

// What it does, as a badge (the first thing it does is enough for that)
function badge(effects, seed) {
  const [mark, color] = BADGES[effects[0]] || [];
  if (!mark) return [];
  const span = document.createElement("span");
  span.className = seed ? "badge seed" : "badge";
  span.style.setProperty("--c", color);
  span.innerHTML = mark;
  return [span];
}

const effectText = (effects) => effects.map((k) => t(`page.bag.effects.${k}`));

function renderBag(s) {
  const bag = $("bag");
  // built again only when what is in it changes, so that a drag going on isn't broken
  const key = JSON.stringify([s.items.map((x) => [x.id, x.count, x.active, x.place]), s.eggs, s.favorite_food, s.disliked_food]);
  if (bag.dataset.key !== key) {
    bag.dataset.key = key;
    const fruits = [], foods = [], seeds = [], wear = [];
    for (const item of s.items) {
      if (item.kind === "fruit" || item.kind === "food") {
        const b = bagTile(app.thing(item.id), item.label, [item.label, ...effectText(item.effects)].join(" · "));
        b.dataset.action = "feed";
        b.dataset.item = item.id;
        if (item.effects.some((k) => k === "trick" || k === "train")) b.dataset.boost = "1";
        // how many, and once found out, what it loves and what it won't eat
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = `×${item.count}`;
        const mark = s.favorite_food === item.id ? "❤" : s.disliked_food === item.id ? "✕" : "";
        if (mark) n.append(" ", Object.assign(document.createElement("b"), { textContent: mark }));
        b.append(n, ...badge(item.effects));
        if (item.effects.some((k) => PACKED.includes(k))) b.append(Object.assign(packPicture("backpack"), { className: "packs" }));
        (item.kind === "fruit" ? fruits : foods).push(b);
      } else if (item.kind === "seed") {
        const plant = item.id.replace("seed_", "");
        const b = bagTile(app.thing("seed"), item.label, [item.label,
          t("page.bag.grows", { fruit: s.item_labels[`fruit_${plant}`] || plant }), ...effectText(item.effects)].join(" · "));
        b.dataset.action = "plant";
        b.dataset.item = plant;
        const n = document.createElement("span");
        n.className = "n";
        n.textContent = `×${item.count}`;
        b.append(n, ...badge(item.effects, true));
        seeds.push(b);
      } else {
        const b = bagTile(app.discovery(item.id, true), item.label, [item.label, t(`page.kinds.${item.kind}`),
          item.place === "inside" && t("page.bag.inside"), ...effectText(item.effects)].filter(Boolean).join(" · "));
        b.classList.toggle("worn", item.active);
        b.append(...badge(item.effects));
        pressable(b, () => act(item.kind === "hat" ? "wear" : "deco", item.id));
        wear.push(b);
      }
    }
    for (const egg of s.eggs) {
      // what a pet has passed on to its egg
      const b = bagTile(app.icon("egg", egg.line), egg.label, [egg.label, t("page.bag.egg"),
        egg.from && t("page.bag.egg_from", { name: egg.from }), ...egg.skills.map((k) => `${k.label} ${k.value}`)]
        .filter(Boolean).join(" · "));
      pressable(b, () => newEgg(egg));
      wear.push(b);
    }
    const eat = [...fruits, ...foods];
    eat.concat(seeds).forEach(draggable);
    const shelf = (title, tiles) => {
      if (!tiles.length) return [];
      const div = document.createElement("div"), label = document.createElement("div"), row = document.createElement("div");
      div.className = "shelf";
      label.className = "label";
      label.textContent = t(title);
      row.append(...tiles);
      div.append(label, row);
      return [div];
    };
    bag.replaceChildren(...shelf("page.bag.food", eat), ...shelf("page.bag.seeds", seeds), ...shelf("page.bag.wear", wear));
    $("bag-empty").hidden = bag.children.length > 0;
  }
  // what it can't have right now looks it; dragged onto it anyway, it says why
  bag.querySelectorAll("[data-action]").forEach((b) => b.classList.toggle("locked", !s.actions[b.dataset.action]));
}

// A tile that is tapped (a hat, a decoration, an egg): held a moment instead, it says what it is
const HOLD_MS = 450;
function pressable(b, onTap) {
  let timer = 0, held = false;
  b.addEventListener("pointerdown", () => {
    held = false;
    clearTimeout(timer);
    timer = setTimeout(() => {
      held = true;
      say(b.dataset.info);
      feel("tap");
    }, HOLD_MS);
  });
  for (const type of ["pointerleave", "pointercancel"]) b.addEventListener(type, () => clearTimeout(timer));
  b.addEventListener("click", () => {
    clearTimeout(timer);
    if (!held) onTap();
    held = false;
  });
}

// Its friends, in the album below the pets: how far each one is from the next nest
let albumHas = false;
function renderFriends(s) {
  // a display from before there could be several friends only tells of one
  const friends = s.friends ?? (s.friend ? [s.friend] : []);
  $("friends").replaceChildren(...friends.map((friend) => {
    // after a nest the visits don't count for a while: an old friend, without a count that doesn't move
    const li = row(friend.label, friend.visiting ? t("page.gallery.friend_here")
      : friend.resting ? t("page.gallery.friend_old")
      : t("page.gallery.friend_visits", { n: friend.visits, needed: friend.needed }));
    if (friend.species) {
      const img = document.createElement("img");
      img.alt = "";
      img.src = app.icon("adult", friend.species);
      li.prepend(img);
    }
    return li;
  }));
  $("friends").hidden = $("friends-label").hidden = !friends.length;
  offerTab("gallery", albumHas || friends.length > 0);
}

function renderGame(s) {
  const game = s.game;
  const active = !!(game && game.active);
  if (!active) gameDismissed = false;
  if (active && !gameDismissed) {
    const last = game.last ? game.last.split(":")[1] : null;
    const left = "🔍".repeat(Math.max(0, game.rounds - game.round));
    $("game-info").textContent = (last ? t(`page.game.${last}`) + "\n" : "")
      + (game.hiding > 1 ? t("page.game.found", { found: game.found.length, hiding: game.hiding }) + " · " : "") + left;
    if ($("game").hidden) openSheet("game");
  } else if (!$("game").hidden && Date.now() >= gameHold) {
    openSheet(null);
  }
}

function trickLabel(id) {
  const trick = current && current.tricks.find((x) => x.id === id);
  return trick ? trick.label : id;
}

function renderTricks(s) {
  // built again only when something changes, so the moves keep drawing themselves
  const key = JSON.stringify(s.tricks);
  if ($("tricks").dataset.key === key) return;
  $("tricks").dataset.key = key;
  $("tricks").replaceChildren(...s.tricks.map((trick) => {
    const li = document.createElement("li");
    li.dataset.trick = trick.id;
    // the move as a picture (its words for screen readers)
    const icon = document.createElement("span");
    icon.className = "move";
    // the move draws itself: each line runs from 0 to 1 along its length
    icon.innerHTML = svg(trick.id).replace(/<(path|circle) /g, '<$1 pathLength="1" ');
    icon.setAttribute("role", "img");
    icon.setAttribute("aria-label", t(`page.gestures.${trick.id}`));
    const text = document.createElement("div");
    text.append(trick.label);
    if (!trick.learned) text.append(meter(trick.progress, "var(--energy)"));
    li.append(icon, text);
    if (trick.learned) {
      const star = document.createElement("span");
      star.className = "learned";
      star.innerHTML = svg("trick");
      li.append(star);
    }
    return li;
  }));
}

// Battle stats in the training sheet: a tap on one starts its exercise
function renderSkills(s) {
  $("skills").replaceChildren(...s.skills.map((skill) => {
    const color = SKILL_COLORS[skill.id] || "var(--accent)";
    const li = document.createElement("li");
    li.dataset.skill = skill.id;
    const icon = packPicture(skill.id);
    const text = document.createElement("div");
    const hint = document.createElement("small");
    hint.textContent = t(`page.train.how.${skill.id}`);
    text.append(skill.label, hint, meter(skill.value, color));
    const value = document.createElement("b");
    value.textContent = Math.floor(skill.value);
    li.append(icon, text, value);
    return li;
  }));
}

async function refresh() {
  try {
    render(await api("GET", "/api/pet"));
    askTwins();
    if (view === "diary") renderEvents((await api("GET", "/api/pet/events?limit=30")).events);
    // the update: while "More" is open or it runs, otherwise now and then
    if (app.mode === "pi" && app.home() === "display" && (view === "more" || update?.running || app.fit() !== "ok"
      || Date.now() - updateChecked > 600_000)) checkUpdate();
  } catch (err) {
    fail(err);
  }
}

// How it is: its weight and the bond (the needs are on the pet's own screen)
function renderValues(s) {
  const note = { heavy: t("page.weight.heavy"), light: t("page.weight.light") }[s.weight_status] || "";
  $("values").replaceChildren(
    row(t("page.values.weight"), t("page.values.ideal", { ideal: s.ideal_weight }) + note, figure(`${Math.round(s.weight)} g`)),

  );

function renderStatistics(s) {

    [t("page.statistics.meals"), c.meals || 0],
